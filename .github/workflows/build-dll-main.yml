name: Build MPC DLL

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dll:
    runs-on: windows-latest
    steps:
      - name: Checkout MPC source from edit
        uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Import Bannerlord DLLs from main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main --depth=1
          git checkout origin/main -- DLLs
          if (!(Test-Path DLLs)) { throw 'DLLs directory is missing' }
          git restore --staged DLLs 2>$null

      - name: Thematic split
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project tools/RoslynSplitter/RoslynSplitter.csproj -- rebuild rebuild
          if (!(Test-Path rebuild/REFACTOR_MAP.txt)) { throw 'Thematic split failed' }

      - name: Verify source layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem rebuild -Filter *.cs -File)
          if ($files.Count -ne 10) { throw "Expected 10 thematic C# files, got $($files.Count)" }
          if (!(Test-Path rebuild/MultiplayerCampaignRebuild.csproj)) { throw 'Build project is missing' }

      - name: Restore
        shell: pwsh
        run: dotnet restore rebuild/MultiplayerCampaignRebuild.csproj --verbosity normal

      - name: Build Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build rebuild/MultiplayerCampaignRebuild.csproj --configuration Release --no-restore --verbosity normal

      - name: Verify DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = 'rebuild/bin/Release/netstandard2.0/MultiplayerCampaign.dll'
          if (!(Test-Path $dll)) { throw 'Release DLL was not produced' }
          $item = Get-Item $dll
          if ($item.Length -le 0) { throw 'Release DLL is empty' }
          Write-Host "DLL_SIZE=$($item.Length)"

      - name: Publish DLL into main/build-dll
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $src = (Resolve-Path 'rebuild/bin/Release/netstandard2.0/MultiplayerCampaign.dll').Path
          if (Test-Path 'main-out') { Remove-Item 'main-out' -Recurse -Force }
          git clone --depth 1 --branch main "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git" main-out
          New-Item -ItemType Directory -Force -Path 'main-out/build-dll' | Out-Null
          Copy-Item $src 'main-out/build-dll/MultiplayerCampaign.dll' -Force
          Push-Location main-out
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-dll/MultiplayerCampaign.dll
          if (git diff --cached --quiet) {
            Write-Host 'build-dll is already current.'
            Pop-Location
            exit 0
          }
          git commit -m 'build: publish MultiplayerCampaign.dll [skip ci]'
          git push origin HEAD:main
          Pop-Location
