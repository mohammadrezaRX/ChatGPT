name: Build edit branch

on:
  push:
    branches:
      - edit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: edit

      - name: Replace rebuild source with current main source
        shell: pwsh
        run: |
          git fetch origin main
          $source = Join-Path $env:GITHUB_WORKSPACE 'MultiplayerCampaignSubModule.cs'
          $target = Join-Path $env:GITHUB_WORKSPACE 'rebuild\MultiplayerCampaignSubModule.cs'
          git show origin/main:MultiplayerCampaignSubModule.cs | Set-Content -Path $target -Encoding utf8
          Write-Host "Copied main source to rebuild."

      - name: Write repository-local project
        shell: pwsh
        run: |
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <AssemblyName>MultiplayerCampaign</AssemblyName>
              <RootNamespace>MultiplayerCampaign</RootNamespace>
              <LangVersion>latest</LangVersion>
              <Nullable>disable</Nullable>
              <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
              <GenerateAssemblyInfo>true</GenerateAssemblyInfo>
              <AutoGenerateBindingRedirects>false</AutoGenerateBindingRedirects>
              <OutputPath>bin\Debug\netstandard2.0\</OutputPath>
              <AppendTargetFrameworkToOutputPath>false</AppendTargetFrameworkToOutputPath>
              <NoWarn>MSB3277</NoWarn>
            </PropertyGroup>
            <ItemGroup>
              <Reference Include="0Harmony"><HintPath>..\DLLs\0Harmony.dll</HintPath><Private>false</Private><SpecificVersion>false</SpecificVersion></Reference>
              <Reference Include="TaleWorlds.Core"><HintPath>..\DLLs\TaleWorlds.Core.dll</HintPath><Private>false</Private><SpecificVersion>false</SpecificVersion></Reference>
              <Reference Include="TaleWorlds.Library"><HintPath>..\DLLs\TaleWorlds.Library.dll</HintPath><Private>false</Private><SpecificVersion>false</SpecificVersion></Reference>
              <Reference Include="TaleWorlds.Localization"><HintPath>..\DLLs\TaleWorlds.Localization.dll</HintPath><Private>false</Private><SpecificVersion>false</SpecificVersion></Reference>
              <Reference Include="TaleWorlds.ScreenSystem"><HintPath>..\DLLs\TaleWorlds.ScreenSystem.dll</HintPath><Private>false</Private><SpecificVersion>false</SpecificVersion></Reference>
              <Reference Include="TaleWorlds.MountAndBlade"><HintPath>..\DLLs\TaleWorlds.MountAndBlade.dll</HintPath><Private>false</Private><SpecificVersion>false</SpecificVersion></Reference>
              <Reference Include="TaleWorlds.CampaignSystem"><HintPath>..\DLLs\TaleWorlds.CampaignSystem.dll</HintPath><Private>false</Private><SpecificVersion>false</SpecificVersion></Reference>
              <Reference Include="TaleWorlds.Engine"><HintPath>..\DLLs\TaleWorlds.Engine.dll</HintPath><Private>false</Private><SpecificVersion>false</SpecificVersion></Reference>
              <Reference Include="TaleWorlds.ObjectSystem"><HintPath>..\DLLs\TaleWorlds.ObjectSystem.dll</HintPath><Private>false</Private><SpecificVersion>false</SpecificVersion></Reference>
              <Reference Include="TaleWorlds.SaveSystem"><HintPath>..\DLLs\TaleWorlds.SaveSystem.dll</HintPath><Private>false</Private><SpecificVersion>false</SpecificVersion></Reference>
              <Reference Include="TaleWorlds.Engine.GauntletUI"><HintPath>..\DLLs\TaleWorlds.Engine.GauntletUI.dll</HintPath><Private>false</Private><SpecificVersion>false</SpecificVersion></Reference>
              <Reference Include="TaleWorlds.GauntletUI"><HintPath>..\DLLs\TaleWorlds.GauntletUI.dll</HintPath><Private>false</Private><SpecificVersion>false</SpecificVersion></Reference>
              <Reference Include="TaleWorlds.GauntletUI.Data"><HintPath>..\DLLs\TaleWorlds.GauntletUI.Data.dll</HintPath><Private>false</Private><SpecificVersion>false</SpecificVersion></Reference>
              <Reference Include="TaleWorlds.MountAndBlade.View"><HintPath>..\DLLs\TaleWorlds.MountAndBlade.View.dll</HintPath><Private>false</Private><SpecificVersion>false</SpecificVersion></Reference>
              <Reference Include="TaleWorlds.MountAndBlade.ViewModelCollection"><HintPath>..\DLLs\TaleWorlds.MountAndBlade.ViewModelCollection.dll</HintPath><Private>false</Private><SpecificVersion>false</SpecificVersion></Reference>
              <Reference Include="SandBox"><HintPath>..\DLLs\SandBox.dll</HintPath><Private>false</Private><SpecificVersion>false</SpecificVersion></Reference>
            </ItemGroup>
          </Project>
          '@ | Set-Content rebuild\MultiplayerCampaignRebuild.csproj -Encoding utf8

      - name: Keep rebuild directory limited to three source files
        shell: pwsh
        run: |
          $allowed = @('MultiplayerCampaignSubModule.cs','MultiplayerCampaignRebuild.csproj','MultiplayerCampaign.xml')
          Get-ChildItem rebuild -File -Recurse | ForEach-Object {
            if ($allowed -notcontains $_.Name) { Remove-Item $_.FullName -Force }
          }

      - name: Commit normalized rebuild source/project
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebuild/MultiplayerCampaignSubModule.cs rebuild/MultiplayerCampaignRebuild.csproj rebuild/MultiplayerCampaign.xml
          if (git diff --cached --quiet) { Write-Host 'No normalization changes to commit.' } else {
            git commit -m "Normalize edit rebuild source and project"
            git push origin edit
          }

      - name: Restore
        run: dotnet restore rebuild\MultiplayerCampaignRebuild.csproj --nologo

      - name: Build
        run: dotnet build rebuild\MultiplayerCampaignRebuild.csproj --no-restore --nologo --verbosity minimal

      - name: Upload DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MultiplayerCampaign-edit-dll
          path: rebuild\bin\Debug\netstandard2.0\MultiplayerCampaign.dll
