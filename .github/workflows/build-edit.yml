name: Build edit branch

on:
  push:
    branches: [edit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify rebuild files
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path rebuild -File -Recurse | Where-Object { $_.FullName -notmatch '\\bin\\|\\obj\\' })
          $names = @($files | ForEach-Object { $_.Name })
          $required = @('MultiplayerCampaignSubModule.cs','MultiplayerCampaignRebuild.csproj','MultiplayerCampaign.xml')
          foreach ($name in $required) {
            if ($names -notcontains $name) { throw "Missing rebuild/$name" }
          }
          if ($names.Count -ne 3) { throw "rebuild must contain exactly 3 files; found $($names.Count)." }
          Write-Host 'rebuild directory is correct.'

      - name: Restore
        run: dotnet restore rebuild\MultiplayerCampaignRebuild.csproj --nologo

      - name: Build
        run: dotnet build rebuild\MultiplayerCampaignRebuild.csproj --no-restore --nologo --verbosity normal

      - name: Upload DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MultiplayerCampaign-edit-dll
          path: rebuild\bin\Debug\netstandard2.0\MultiplayerCampaign.dll
          if-no-files-found: error
