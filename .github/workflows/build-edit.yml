name: Build edit branch

on:
  push:
    branches: [edit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify rebuild files
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path rebuild -File -Recurse | Where-Object { $_.FullName -notmatch '\\bin\\|\\obj\\' })
          $names = @($files | ForEach-Object { $_.Name })
          $required = @('MultiplayerCampaignSubModule.cs','MultiplayerCampaignRebuild.csproj','MultiplayerCampaign.xml')
          foreach ($name in $required) {
            if ($names -notcontains $name) { throw "Missing rebuild/$name" }
          }
          if ($names.Count -ne 3) { throw "rebuild must contain exactly 3 files; found $($names.Count)." }
          Write-Host 'rebuild directory is correct.'

      - name: Download Bannerlord reference DLLs
        shell: pwsh
        run: |
          $base = 'https://raw.githubusercontent.com/mohammadrezaRX/ChatGPT/main/DLLs'
          $dlls = @(
            '0Harmony.dll',
            'SandBox.dll',
            'TaleWorlds.CampaignSystem.dll',
            'TaleWorlds.Core.dll',
            'TaleWorlds.Engine.GauntletUI.dll',
            'TaleWorlds.Engine.dll',
            'TaleWorlds.GauntletUI.Data.dll',
            'TaleWorlds.GauntletUI.dll',
            'TaleWorlds.Library.dll',
            'TaleWorlds.Localization.dll',
            'TaleWorlds.MountAndBlade.View.dll',
            'TaleWorlds.MountAndBlade.ViewModelCollection.dll',
            'TaleWorlds.MountAndBlade.dll',
            'TaleWorlds.ObjectSystem.dll',
            'TaleWorlds.SaveSystem.dll',
            'TaleWorlds.ScreenSystem.dll'
          )
          New-Item -ItemType Directory -Path DLLs -Force | Out-Null
          foreach ($dll in $dlls) {
            Invoke-WebRequest -Uri "$base/$dll" -OutFile "DLLs/$dll"
          }
          Write-Host "Downloaded $($dlls.Count) reference DLLs."

      - name: Restore
        run: dotnet restore rebuild\MultiplayerCampaignRebuild.csproj --nologo

      - name: Build
        run: dotnet build rebuild\MultiplayerCampaignRebuild.csproj --no-restore --nologo --verbosity normal

      - name: Upload DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MultiplayerCampaign-edit-dll
          path: rebuild\bin\Debug\netstandard2.0\MultiplayerCampaign.dll
          if-no-files-found: error
