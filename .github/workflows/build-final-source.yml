name: Generate full MPC build source

on:
  push:
    branches:
      - mpc-build-final
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: mpc-build-final

      - name: Generate rebuild source
        shell: python
        run: |
          from pathlib import Path

          original = Path('MultiplayerCampaignSubModule.cs').read_text(encoding='utf-8-sig')
          marker = '// ================= MPC FINAL MULTIPLAYER CAMPAIGN LAYER ================='
          if marker in original:
              rebuilt = original
          else:
              layer = r'''\n\n// ================= MPC FINAL MULTIPLAYER CAMPAIGN LAYER =================\n// This layer intentionally preserves the existing Multiplayer Campaign core.\n// It is appended to the complete original source and uses Harmony + queues\n// so the Network thread never mutates Campaign state directly.\n\nnamespace MultiplayerCampaign\n{\n    internal sealed class MpcCharacterSlotRecord\n    {\n        public int Slot;\n        public string CharacterId;\n        public string Name;\n        public long CreatedUtcTicks;\n        public string Data;\n    }\n\n    internal static class MpcCharacterSlots\n    {\n        private const int SlotCount = 3;\n        private static readonly object Sync = new object();\n        private static readonly MpcCharacterSlotRecord[] Slots = new MpcCharacterSlotRecord[SlotCount];\n        private static bool Loaded;\n        private static int SelectedSlot = -1;\n\n        private static string FilePath\n        {\n            get\n            {\n                string root = System.Environment.GetFolderPath(System.Environment.SpecialFolder.ApplicationData);\n                return System.IO.Path.Combine(root, "MultiplayerCampaign", "characters.dat");\n            }\n        }\n\n        public static void Initialize()\n        {\n            lock (Sync)\n            {\n                if (Loaded) return;\n                Loaded = true;\n                LoadLocked();\n            }\n        }\n\n        public static bool HasSelectedSlot\n        {\n            get { lock (Sync) { return SelectedSlot >= 0 && SelectedSlot < SlotCount; } }\n        }\n\n        public static int CurrentSlot\n        {\n            get { lock (Sync) { return SelectedSlot; } }\n        }\n\n        public static MpcCharacterSlotRecord GetSlot(int slot)\n        {\n            Initialize();\n            if (slot < 0 || slot >= SlotCount) return null;\n            lock (Sync) return Slots[slot];\n        }\n\n        public static bool SelectSlot(int slot)\n        {\n            Initialize();\n            if (slot < 0 || slot >= SlotCount) return false;\n            lock (Sync)\n            {\n                SelectedSlot = slot;\n                SaveLocked();\n                return true;\n            }\n        }\n\n        public static string GetSelectedCharacterId()\n        {\n            Initialize();\n            lock (Sync)\n            {\n                if (SelectedSlot < 0 || SelectedSlot >= SlotCount) return null;\n                return Slots[SelectedSlot] == null ? null : Slots[SelectedSlot].CharacterId;\n            }\n        }\n\n        public static MpcCharacterSlotRecord CreateOrUpdate(int slot, string name, string data)\n        {\n            Initialize();\n            if (slot < 0 || slot >= SlotCount) return null;\n            lock (Sync)\n            {\n                MpcCharacterSlotRecord record = Slots[slot];\n                if (record == null)\n                {\n                    record = new MpcCharacterSlotRecord();\n                    record.Slot = slot;\n                    record.CharacterId = System.Guid.NewGuid().ToString("N");\n                    record.CreatedUtcTicks = System.DateTime.UtcNow.Ticks;\n                    Slots[slot] = record;\n                }\n\n                record.Name = NormalizeName(name);\n                record.Data = data ?? "";\n                SelectedSlot = slot;\n                SaveLocked();\n                return record;\n            }\n        }\n\n        public static bool IsEmpty(int slot)\n        {\n            Initialize();\n            if (slot < 0 || slot >= SlotCount) return true;\n            lock (Sync) return Slots[slot] == null || string.IsNullOrWhiteSpace(Slots[slot].CharacterId);\n        }\n\n        public static bool RequireSelectedSlot()\n        {\n            Initialize();\n            lock (Sync)\n            {\n                return SelectedSlot >= 0 && SelectedSlot < SlotCount;\n            }\n        }\n\n        private static string NormalizeName(string value)\n        {\n            if (string.IsNullOrWhiteSpace(value)) return "Player";\n            value = value.Trim();\n            return value.Length > 32 ? value.Substring(0, 32) : value;\n        }\n\n        private static void SaveLocked()\n        {\n            try\n            {\n                string dir = System.IO.Path.GetDirectoryName(FilePath);\n                if (!System.IO.Directory.Exists(dir)) System.IO.Directory.CreateDirectory(dir);\n                using (var stream = new System.IO.FileStream(FilePath, System.IO.FileMode.Create, System.IO.FileAccess.Write, System.IO.FileShare.None))\n                using (var writer = new System.IO.BinaryWriter(stream, System.Text.Encoding.UTF8, true))\n                {\n                    writer.Write(1);\n                    writer.Write(SelectedSlot);\n                    for (int i = 0; i < SlotCount; i++)\n                    {\n                        var s = Slots[i];\n                        writer.Write(s != null);\n                        if (s == null) continue;\n                        writer.Write(s.Slot);\n                        writer.Write(s.CharacterId ?? "");\n                        writer.Write(s.Name ?? "Player");\n                        writer.Write(s.CreatedUtcTicks);\n                        writer.Write(s.Data ?? "");\n                    }\n                }\n            }\n            catch { }\n        }\n\n        private static void LoadLocked()\n        {\n            try\n            {\n                if (!System.IO.File.Exists(FilePath)) return;\n                using (var stream = new System.IO.FileStream(FilePath, System.IO.FileMode.Open, System.IO.FileAccess.Read, System.IO.FileShare.Read))\n                using (var reader = new System.IO.BinaryReader(stream, System.Text.Encoding.UTF8, true))\n                {\n                    int version = reader.ReadInt32();\n                    if (version != 1) return;\n                    SelectedSlot = reader.ReadInt32();\n                    for (int i = 0; i < SlotCount; i++)\n                    {\n                        if (!reader.ReadBoolean()) { Slots[i] = null; continue; }\n                        Slots[i] = new MpcCharacterSlotRecord\n                        {\n                            Slot = reader.ReadInt32(),\n                            CharacterId = reader.ReadString(),\n                            Name = reader.ReadString(),\n                            CreatedUtcTicks = reader.ReadInt64(),\n                            Data = reader.ReadString()\n                        };\n                    }\n                }\n            }\n            catch\n            {\n                SelectedSlot = -1;\n                for (int i = 0; i < SlotCount; i++) Slots[i] = null;\n            }\n        }\n    }\n\n    internal sealed class MpcPartySyncState\n    {\n        public string PlayerId;\n        public string CharacterId;\n        public string Name;\n        public float X;\n        public float Y;\n        public float TargetX;\n        public float TargetY;\n        public bool Moving;\n        public int PartySize;\n        public long Sequence;\n        public long Revision;\n        public bool Active;\n        public long TimestampUtcTicks;\n    }\n\n    internal static class MpcFinalWorldState\n    {\n        private static readonly object Sync = new object();\n        private static readonly System.Collections.Generic.Dictionary<string, MpcPartySyncState> Players = new System.Collections.Generic.Dictionary<string, MpcPartySyncState>();\n        private static long Sequence;\n        private static long Revision;\n        private static double HostTime;\n        private static double HostTimeRate = 1.0;\n        private static bool HostPaused;\n        private static long LastTickUtc;\n\n        public static void Reset()\n        {\n            lock (Sync)\n            {\n                Players.Clear();\n                Sequence = 0;\n                Revision = 0;\n                HostTime = 0;\n                HostTimeRate = 1.0;\n                HostPaused = false;\n                LastTickUtc = 0;\n            }\n        }\n\n        public static long NextSequence() { lock (Sync) return ++Sequence; }\n        public static long CurrentRevision { get { lock (Sync) return Revision; } }\n        public static void BumpRevision() { lock (Sync) { Revision++; } }\n\n        public static bool Accept(string playerId, long sequence, long revision)\n        {\n            if (string.IsNullOrWhiteSpace(playerId)) return false;\n            lock (Sync)\n            {\n                MpcPartySyncState state;\n                if (Players.TryGetValue(playerId, out state))\n                {\n                    if (sequence < state.Sequence) return false;\n                    if (sequence == state.Sequence && revision < state.Revision) return false;\n                }\n                return true;\n            }\n        }\n\n        public static void Upsert(MpcPartySyncState state)\n        {\n            if (state == null || string.IsNullOrWhiteSpace(state.PlayerId)) return;\n            lock (Sync)\n            {\n                MpcPartySyncState old;\n                if (Players.TryGetValue(state.PlayerId, out old))\n                {\n                    if (state.Sequence < old.Sequence) return;\n                    if (state.Sequence == old.Sequence && state.Revision < old.Revision) return;\n                }\n                Players[state.PlayerId] = state;\n                Revision = System.Math.Max(Revision, state.Revision);\n            }\n        }\n\n        public static MpcPartySyncState[] Snapshot()\n        {\n            lock (Sync)\n            {\n                var result = new MpcPartySyncState[Players.Count];\n                Players.Values.CopyTo(result, 0);\n                return result;\n            }\n        }\n\n        public static void Remove(string playerId)\n        {\n            if (string.IsNullOrWhiteSpace(playerId)) return;\n            lock (Sync) { Players.Remove(playerId); Revision++; }\n        }\n\n        public static void SetHostClock(double time, double rate, bool paused)\n        {\n            lock (Sync)\n            {\n                HostTime = time;\n                HostTimeRate = rate;\n                HostPaused = paused;\n                LastTickUtc = System.DateTime.UtcNow.Ticks;\n            }\n        }\n\n        public static void AdvanceLocalClock()\n        {\n            lock (Sync)\n            {\n                long now = System.DateTime.UtcNow.Ticks;\n                if (LastTickUtc == 0) { LastTickUtc = now; return; }\n                double dt = (now - LastTickUtc) / (double)System.TimeSpan.TicksPerSecond;\n                LastTickUtc = now;\n                if (!HostPaused) HostTime += dt * HostTimeRate;\n            }\n        }\n\n        public static double GetHostTime() { lock (Sync) return HostTime; }\n        public static double GetHostRate() { lock (Sync) return HostTimeRate; }\n        public static bool IsHostPaused { get { lock (Sync) return HostPaused; } }\n    }\n\n    internal static class MpcFinalPacketCodec\n    {\n        private const int MaxPayload = 64 * 1024;\n        private static readonly byte[] Magic = new byte[] { 0x4D, 0x50, 0x43, 0x46 };\n\n        public static byte[] BuildTimePacket()\n        {\n            return Build(w =>\n            {\n                w.Write((byte)1);\n                w.Write(MpcFinalWorldState.GetHostTime());\n                w.Write(MpcFinalWorldState.GetHostRate());\n                w.Write(MpcFinalWorldState.IsHostPaused);\n                w.Write(MpcFinalWorldState.CurrentRevision);\n            });\n        }\n\n        public static byte[] BuildPlayerPacket(MpcPartySyncState state)\n        {\n            if (state == null) return null;\n            return Build(w =>\n            {\n                w.Write((byte)2);\n                w.Write(state.PlayerId ?? "");\n                w.Write(state.CharacterId ?? "");\n                w.Write(state.Name ?? "Player");\n                w.Write(state.X);\n                w.Write(state.Y);\n                w.Write(state.TargetX);\n                w.Write(state.TargetY);\n                w.Write(state.Moving);\n                w.Write(state.PartySize);\n                w.Write(state.Sequence);\n                w.Write(state.Revision);\n                w.Write(state.Active);\n                w.Write(state.TimestampUtcTicks);\n            });\n        }\n\n        public static bool TryRead(byte[] payload, out int kind, out MpcPartySyncState player, out double hostTime, out double hostRate, out bool paused, out long revision)\n        {\n            kind = 0; player = null; hostTime = 0; hostRate = 1; paused = false; revision = 0;\n            if (payload == null || payload.Length < Magic.Length + 1 || payload.Length > MaxPayload) return false;\n            try\n            {\n                using (var stream = new System.IO.MemoryStream(payload))\n                using (var reader = new System.IO.BinaryReader(stream, System.Text.Encoding.UTF8, true))\n                {\n                    for (int i = 0; i < Magic.Length; i++) if (reader.ReadByte() != Magic[i]) return false;\n                    kind = reader.ReadByte();\n                    if (kind == 1)\n                    {\n                        hostTime = reader.ReadDouble();\n                        hostRate = reader.ReadDouble();\n                        paused = reader.ReadBoolean();\n                        revision = reader.ReadInt64();\n                        return true;\n                    }\n                    if (kind == 2)\n                    {\n                        player = new MpcPartySyncState\n                        {\n                            PlayerId = reader.ReadString(),\n                            CharacterId = reader.ReadString(),\n                            Name = reader.ReadString(),\n                            X = reader.ReadSingle(),\n                            Y = reader.ReadSingle(),\n                            TargetX = reader.ReadSingle(),\n                            TargetY = reader.ReadSingle(),\n                            Moving = reader.ReadBoolean(),\n                            PartySize = reader.ReadInt32(),\n                            Sequence = reader.ReadInt64(),\n                            Revision = reader.ReadInt64(),\n                            Active = reader.ReadBoolean(),\n                            TimestampUtcTicks = reader.ReadInt64()\n                        };\n                        if (!NetworkUtilitiesSafe(player)) { player = null; return false; }\n                        return true;\n                    }\n                }\n            }\n            catch { }\n            return false;\n        }\n\n        private static byte[] Build(System.Action<System.IO.BinaryWriter> action)\n        {\n            using (var stream = new System.IO.MemoryStream())\n            using (var writer = new System.IO.BinaryWriter(stream, System.Text.Encoding.UTF8, true))\n            {\n                for (int i = 0; i < Magic.Length; i++) writer.Write(Magic[i]);\n                action(writer);\n                writer.Flush();\n                byte[] data = stream.ToArray();\n                return data.Length <= MaxPayload ? data : null;\n            }\n        }\n\n        private static bool NetworkUtilitiesSafe(MpcPartySyncState s)\n        {\n            if (s == null || string.IsNullOrWhiteSpace(s.PlayerId)) return false;\n            if (float.IsNaN(s.X) || float.IsInfinity(s.X) || float.IsNaN(s.Y) || float.IsInfinity(s.Y)) return false;\n            if (float.IsNaN(s.TargetX) || float.IsInfinity(s.TargetX) || float.IsNaN(s.TargetY) || float.IsInfinity(s.TargetY)) return false;\n            if (s.PartySize < 1 || s.PartySize > 10000) return false;\n            return true;\n        }\n    }\n\n    internal static class MpcFinalPartyRuntime\n    {\n        private static readonly object Sync = new object();\n        private static MpcPartySyncState LocalState;\n        private static readonly System.Collections.Generic.Dictionary<string, MpcPartySyncState> RemoteStates = new System.Collections.Generic.Dictionary<string, MpcPartySyncState>();\n\n        public static void Reset()\n        {\n            lock (Sync)\n            {\n                LocalState = null;\n                RemoteStates.Clear();\n            }\n            MpcFinalWorldState.Reset();\n        }\n\n        public static void UpdateLocalState(float dt)\n        {\n            try\n            {\n                if (TaleWorlds.CampaignSystem.Campaign.Current == null) return;\n                MobileParty party = MobileParty.MainParty;\n                if (party == null) return;\n                CampaignVec2 pos = party.Position;\n                string id = LocalPlayerState.GetNetworkId();\n                string characterId = MpcCharacterSlots.GetSelectedCharacterId() ?? id;\n                int size = CampaignWorld.GetMainPartySize();\n                MpcPartySyncState next = new MpcPartySyncState\n                {\n                    PlayerId = id,\n                    CharacterId = characterId,\n                    Name = LocalPlayerState.GetDisplayName(),\n                    X = pos.X,\n                    Y = pos.Y,\n                    TargetX = pos.X,\n                    TargetY = pos.Y,\n                    Moving = false,\n                    PartySize = size,\n                    Sequence = MpcFinalWorldState.NextSequence(),\n                    Revision = MpcFinalWorldState.CurrentRevision,\n                    Active = true,\n                    TimestampUtcTicks = System.DateTime.UtcNow.Ticks\n                };\n                lock (Sync) LocalState = next;\n            }\n            catch { }\n        }\n\n        public static MpcPartySyncState GetLocalState() { lock (Sync) return LocalState; }\n\n        public static void ApplyRemote(MpcPartySyncState state)\n        {\n            if (state == null) return;\n            if (state.PlayerId == LocalPlayerState.GetNetworkId()) return;\n            if (!MpcFinalWorldState.Accept(state.PlayerId, state.Sequence, state.Revision)) return;\n            lock (Sync) RemoteStates[state.PlayerId] = state;\n            MpcFinalWorldState.Upsert(state);\n        }\n\n        public static MpcPartySyncState[] SnapshotRemote()\n        {\n            lock (Sync)\n            {\n                var result = new MpcPartySyncState[RemoteStates.Count];\n                RemoteStates.Values.CopyTo(result, 0);\n                return result;\n            }\n        }\n\n        public static void RemoveRemote(string playerId)\n        {\n            if (string.IsNullOrWhiteSpace(playerId)) return;\n            lock (Sync) RemoteStates.Remove(playerId);\n            MpcFinalWorldState.Remove(playerId);\n        }\n\n        public static bool IsIndependentFromHostParty()\n        {\n            try\n            {\n                if (!MultiplayerSessionState.IsClient) return true;\n                // The final layer never creates or aliases a client Hero/MobileParty to the Host object.\n                // This guard exists so future concrete Campaign object creation can be safely plugged in.\n                return true;\n            }\n            catch { return false; }\n        }\n    }\n\n    internal static class MpcFinalTimeRuntime\n    {\n        private static float Timer;\n        private static bool Initialized;\n\n        public static void Update(float dt)\n        {\n            try\n            {\n                if (TaleWorlds.CampaignSystem.Campaign.Current == null) return;\n                MpcFinalWorldState.AdvanceLocalClock();\n                Timer += System.Math.Max(0f, System.Math.Min(1f, dt));\n                if (Timer < 0.5f) return;\n                Timer = 0f;\n                double time = ReadCampaignTime();\n                if (!Initialized) { MpcFinalWorldState.SetHostClock(time, 1.0, false); Initialized = true; }\n            }\n            catch { }\n        }\n\n        private static double ReadCampaignTime()\n        {\n            object campaign = TaleWorlds.CampaignSystem.Campaign.Current;\n            if (campaign == null) return 0;\n            string[] names = new string[] { "CurrentDateTime", "CurrentTime", "TimeOfDay", "DateTime" };\n            for (int i = 0; i < names.Length; i++)\n            {\n                try\n                {\n                    var property = campaign.GetType().GetProperty(names[i]);\n                    if (property == null || !property.CanRead) continue;\n                    object value = property.GetValue(campaign, null);\n                    if (value is double) return (double)value;\n                    if (value is float) return (float)value;\n                    if (value is int) return (int)value;\n                    if (value is long) return (long)value;\n                }\n                catch { }\n            }\n            return System.DateTime.UtcNow.TimeOfDay.TotalHours;\n        }\n    }\n\n    internal static class MpcFinalNetworkBoundary\n    {\n        private static readonly System.Collections.Concurrent.ConcurrentQueue<byte[]> Incoming = new System.Collections.Concurrent.ConcurrentQueue<byte[]>();\n        private static readonly System.Collections.Concurrent.ConcurrentQueue<byte[]> Outgoing = new System.Collections.Concurrent.ConcurrentQueue<byte[]>();\n\n        public static void EnqueueIncoming(byte[] packet)\n        {\n            if (packet == null || packet.Length == 0 || packet.Length > 64 * 1024) return;\n            Incoming.Enqueue((byte[])packet.Clone());\n        }\n\n        public static void EnqueueOutgoing(byte[] packet)\n        {\n            if (packet == null || packet.Length == 0 || packet.Length > 64 * 1024) return;\n            Outgoing.Enqueue((byte[])packet.Clone());\n        }\n\n        public static bool TryDequeueIncoming(out byte[] packet) => Incoming.TryDequeue(out packet);\n        public static bool TryDequeueOutgoing(out byte[] packet) => Outgoing.TryDequeue(out packet);\n\n        public static void Clear()\n        {\n            while (Incoming.TryDequeue(out _)) { }\n            while (Outgoing.TryDequeue(out _)) { }\n        }\n    }\n\n    [HarmonyPatch(typeof(MultiplayerNetworkClient), "Connect")]\n    internal static class MpcFinalConnectGuardPatch\n    {\n        private static bool Prefix()\n        {\n            try\n            {\n                MpcCharacterSlots.Initialize();\n                if (!MpcCharacterSlots.RequireSelectedSlot())\n                {\n                    CampaignMessageFeed.Show("Select a character slot before joining the campaign.");\n                    return false;\n                }\n            }\n            catch { }\n            return true;\n        }\n    }\n\n    [HarmonyPatch(typeof(MultiplayerCampaignBehavior), "OnCampaignTick")]\n    internal static class MpcFinalCampaignTickPatch\n    {\n        private static void Postfix(float dt)\n        {\n            try\n            {\n                if (TaleWorlds.CampaignSystem.Campaign.Current == null) return;\n                MpcCharacterSlots.Initialize();\n                MpcFinalTimeRuntime.Update(dt);\n                MpcFinalPartyRuntime.UpdateLocalState(dt);\n                ProcessIncoming();\n                SendLocal();\n                if (MultiplayerSessionState.IsClient) ApplyClientTime();\n            }\n            catch { }\n        }\n\n        private static void ProcessIncoming()\n        {\n            byte[] packet;\n            while (MpcFinalNetworkBoundary.TryDequeueIncoming(out packet))\n            {\n                int kind; MpcPartySyncState player; double time; double rate; bool paused; long revision;\n                if (!MpcFinalPacketCodec.TryRead(packet, out kind, out player, out time, out rate, out paused, out revision)) continue;\n                if (kind == 1) MpcFinalWorldState.SetHostClock(time, rate, paused);\n                else if (kind == 2) MpcFinalPartyRuntime.ApplyRemote(player);\n            }\n        }\n\n        private static void ApplyClientTime()\n        {\n            // Time is kept in the authoritative runtime model; direct Campaign mutation is intentionally guarded.\n            // Concrete Bannerlord time setter calls can be plugged in here without touching network threads.\n        }\n\n        private static void SendLocal()\n        {\n            if (!MultiplayerNetworkClient.Instance.IsConnected || !MultiplayerNetworkClient.Instance.IsWorldLoaded) return;\n            MpcPartySyncState local = MpcFinalPartyRuntime.GetLocalState();\n            if (local == null) return;\n            byte[] packet = MpcFinalPacketCodec.BuildPlayerPacket(local);\n            if (packet == null) return;\n            MpcFinalNetworkBoundary.EnqueueOutgoing(packet);\n            MultiplayerNetworkClient.Instance.Send(NetworkPacketType.WorldJoinTest, packet);\n        }\n    }\n\n    [HarmonyPatch(typeof(MultiplayerCampaignHost), "Update")]\n    internal static class MpcFinalHostUpdatePatch\n    {\n        private static float Timer;\n\n        private static void Postfix()\n        {\n            try\n            {\n                Timer += 0.1f;\n                if (Timer < 0.5f) return;\n                Timer = 0f;\n\n                MpcFinalWorldState.SetHostClock(System.DateTime.UtcNow.TimeOfDay.TotalHours, 1.0, false);\n                byte[] timePacket = MpcFinalPacketCodec.BuildTimePacket();\n                HostClientConnection[] clients = (MultiplayerCampaignHost.CurrentForMpc()?.GetClientsSnapshot()) ?? new HostClientConnection[0];\n                for (int i = 0; i < clients.Length; i++)\n                {\n                    HostClientConnection client = clients[i];\n                    if (client == null) continue;\n                    try { client.Send(new NetworkMessageData(NetworkPacketType.WorldJoinTest, timePacket)); } catch { }\n                }\n\n                MpcPartySyncState[] states = MpcFinalPartyRuntime.SnapshotRemote();\n                for (int s = 0; s < states.Length; s++)\n                {\n                    byte[] packet = MpcFinalPacketCodec.BuildPlayerPacket(states[s]);\n                    if (packet == null) continue;\n                    for (int i = 0; i < clients.Length; i++)\n                    {\n                        HostClientConnection client = clients[i];\n                        if (client == null) continue;\n                        try { client.Send(new NetworkMessageData(NetworkPacketType.WorldJoinTest, packet)); } catch { }\n                    }\n                }\n            }\n            catch { }\n        }\n    }\n\n    internal static class MpcFinalHostAccessor\n    {\n        public static MultiplayerCampaignHost Current()\n        {\n            try { return MultiplayerCampaignSubModule.GetHost(); } catch { return null; }\n        }\n    }\n\n    [HarmonyPatch(typeof(HostClientConnection), "ProcessMessage")]\n    internal static class MpcFinalHostMessagePatch\n    {\n        private static bool Prefix(HostClientConnection __instance, NetworkPacketType type, byte[] payload)\n        {\n            if (type != NetworkPacketType.WorldJoinTest) return true;\n            int kind; MpcPartySyncState player; double time; double rate; bool paused; long revision;\n            if (!MpcFinalPacketCodec.TryRead(payload, out kind, out player, out time, out rate, out paused, out revision)) return true;\n            if (kind == 2 && player != null)\n            {\n                MpcFinalPartyRuntime.ApplyRemote(player);\n                return false;\n            }\n            return false;\n        }\n    }\n\n    [HarmonyPatch(typeof(MultiplayerNetworkClient), "ProcessMessage")]\n    internal static class MpcFinalClientMessagePatch\n    {\n        private static bool Prefix(NetworkMessage message)\n        {\n            if (message == null || message.Type != NetworkPacketType.WorldJoinTest) return true;\n            int kind; MpcPartySyncState player; double time; double rate; bool paused; long revision;\n            if (!MpcFinalPacketCodec.TryRead(message.Payload, out kind, out player, out time, out rate, out paused, out revision)) return true;\n            MpcFinalNetworkBoundary.EnqueueIncoming(message.Payload);\n            return false;\n        }\n    }\n\n    internal static class MpcFinalCleanup\n    {\n        public static void Reset()\n        {\n            try { MpcFinalPartyRuntime.Reset(); } catch { }\n            try { MpcFinalNetworkBoundary.Clear(); } catch { }\n            try { MpcCharacterSlots.Initialize(); } catch { }\n        }\n    }\n\n    // Reflection bridge used only for optional APIs; it keeps the rebuild source compatible.\n    internal static class MpcFinalReflection\n    {\n        public static object Get(object target, string propertyName)\n        {\n            try\n            {\n                if (target == null) return null;\n                var p = target.GetType().GetProperty(propertyName);\n                return p != null && p.CanRead ? p.GetValue(target, null) : null;\n            }\n            catch { return null; }\n        }\n\n        public static bool Set(object target, string propertyName, object value)\n        {\n            try\n            {\n                if (target == null) return false;\n                var p = target.GetType().GetProperty(propertyName);\n                if (p == null || !p.CanWrite) return false;\n                if (value != null && !p.PropertyType.IsAssignableFrom(value.GetType())) return false;\n                p.SetValue(target, value, null);\n                return true;\n            }\n            catch { return false; }\n        }\n    }\n}\n'''
              rebuilt = original + layer
          target = Path('rebuild/MultiplayerCampaignSubModule.cs')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(rebuilt, encoding='utf-8')

      - name: Fix generated source safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('rebuild/MultiplayerCampaignSubModule.cs')
          s = p.read_text(encoding='utf-8')
          s = s.replace('MultiplayerCampaignHost.CurrentForMpc()?.GetClientsSnapshot()', 'MpcFinalHostAccessor.Current()?.GetClientsSnapshot()')
          p.write_text(s, encoding='utf-8')

      - name: Commit generated source and remove generator
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rebuild/MultiplayerCampaignSubModule.cs
          git rm -f .github/workflows/build-final-source.yml
          git commit -m 'Generate full Multiplayer Campaign build source'
          git push origin mpc-build-final
