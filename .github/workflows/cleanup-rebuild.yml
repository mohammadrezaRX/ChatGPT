name: MPC Cleanup

on:
  push:
    branches:
      - edit
    paths:
      - tools/cleanup_rebuild.py

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[cleanup-generated]') }}
    runs-on: windows-latest
    steps:
      - name: Checkout edit
        uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cleanup and split
        shell: pwsh
        run: python tools/cleanup_rebuild.py

      - name: Commit generated split
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebuild
          git status --short
          if (git diff --cached --quiet) {
            Write-Host "No changes to commit."
            exit 0
          }
          git commit -m "Clean and split rebuild sources [cleanup-generated]"
          git push origin HEAD:edit
