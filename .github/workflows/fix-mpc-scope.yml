name: Repair MPC namespaces

on:
  push:
    branches:
      - mpc-full-rebuild-final
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: mpc-full-rebuild-final

      - name: Repair source
        shell: python
        run: |
          from pathlib import Path

          p = Path('rebuild/MultiplayerCampaignSubModule.cs')
          text = p.read_text(encoding='utf-8-sig')

          marker = '// ============================\n// CONTINUATION'
          idx = text.find(marker)
          if idx < 0:
              raise SystemExit('CONTINUATION marker not found')

          before = text[:idx]
          expected = '\n        }\n    }\n}\n'
          if not before.endswith(expected):
              raise SystemExit('Expected namespace boundary not found; refusing blind edit.')

          # Remove only the namespace-closing brace. Keep the NetworkClient class close.
          before = before[:-len('\n}\n')]
          text = before + '\n' + text[idx:]

          rebuild_marker = 'namespace MultiplayerCampaignRebuildLayer\n{\n'
          if rebuild_marker not in text:
              raise SystemExit('Rebuild namespace marker not found')
          text = text.replace(
              rebuild_marker,
              'namespace MultiplayerCampaignRebuildLayer\n{\n    using MultiplayerCampaign;\n    using System.Reflection;\n',
              1,
          )

          safe_marker = 'public static bool TryGetPosition(\n        out CampaignVec2 position)'
          if safe_marker not in text:
              raise SystemExit('SafeCampaignAccess.TryGetPosition marker not found')
          text = text.replace(
              safe_marker,
              'public static bool TryGetMainPartyPosition(\n        out CampaignVec2 position)\n    {\n        return TryGetPosition(out position);\n    }\n\n    ' + safe_marker,
              1,
          )

          p.write_text(text, encoding='utf-8')
          print('MPC namespace/import/helper repairs completed.')

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebuild/MultiplayerCampaignSubModule.cs .github/workflows/fix-mpc-scope.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix MPC namespace scope and helper API"
          git push origin mpc-full-rebuild-final
