name: Fix MPC VM scope and API visibility

on:
  push:
    branches:
      - mpc-full-rebuild-final
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: mpc-full-rebuild-final

      - name: Repair C# source structure
        shell: python
        run: |
          from pathlib import Path
          p = Path('rebuild/MultiplayerCampaignSubModule.cs')
          text = p.read_text(encoding='utf-8-sig')

          marker = '''        public void UpdateNetwork()\n        {\n            MultiplayerNetworkClient\n                .Instance\n                .Update();\n\n            if (\n                MultiplayerNetworkClient\n                    .Instance\n                    .ConsumeWorldReady())\n            {\n                StatusText =\n                    "LOADING HOST WORLD...";\n\n                MultiplayerWorldTransfer\n                    .FinishClientLoad();\n            }\n        }\n    }\n\n\n    /*\n     * ============================================================\n     * NETWORK PROTOCOL\n'''

          if marker not in text:
              raise SystemExit('Expected VM/protocol boundary not found; refusing blind edit.')

          fixed = marker.replace('            }\n        }\n    }\n\n\n    /*\n', '            }\n        }\n    }\n}\n\n\n    /*\n', 1)
          if fixed == marker:
              raise SystemExit('Boundary replacement did not occur.')
          text = text.replace(marker, fixed, 1)

          # These types are used by public methods in the same assembly.
          text = text.replace('internal enum NetworkPacketType : byte', 'public enum NetworkPacketType : byte', 1)
          text = text.replace('public HostClientConnection[] GetClientsSnapshot()', 'internal HostClientConnection[] GetClientsSnapshot()', 1)

          p.write_text(text, encoding='utf-8')
          print('Scope and accessibility repairs completed.')

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebuild/MultiplayerCampaignSubModule.cs .github/workflows/fix-mpc-vm-scope.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Repair MPC source scope and API visibility"
          git push origin mpc-full-rebuild-final
