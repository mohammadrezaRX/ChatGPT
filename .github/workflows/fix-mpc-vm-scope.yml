name: Fix MPC namespace boundary

on:
  push:
    branches:
      - mpc-full-rebuild-final
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: mpc-full-rebuild-final

      - name: Repair namespace and accessibility
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('rebuild/MultiplayerCampaignSubModule.cs')
          text = p.read_text(encoding='utf-8-sig')

          # The previous repair accidentally closed the outer
          # MultiplayerCampaign namespace before NETWORK PROTOCOL.
          # Remove exactly that one namespace-closing brace.
          boundary = re.compile(
              r'(ConsumeWorldReady\(\)\)\n\s*\{.*?\n\s*\}\n\s*\}\n\s*\}\n\s*\n\s*\n\s*/\*\n\s*\* ============================================================\n\s*\* NETWORK PROTOCOL)',
              re.S,
          )
          m = boundary.search(text)
          if not m:
              raise SystemExit('NETWORK PROTOCOL boundary pattern not found; refusing blind edit.')

          replacement = m.group(0)
          replacement = replacement.replace('\n    }\n}\n\n\n    /*\n', '\n    }\n\n\n    /*\n', 1)
          text = text[:m.start()] + replacement + text[m.end():]

          # Public methods cannot expose internal parameter/return types.
          text = text.replace('internal enum NetworkPacketType : byte', 'public enum NetworkPacketType : byte', 1)
          text = text.replace('public HostClientConnection[] GetClientsSnapshot()', 'internal HostClientConnection[] GetClientsSnapshot()', 1)

          p.write_text(text, encoding='utf-8')
          print('MPC namespace and accessibility repairs completed.')

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebuild/MultiplayerCampaignSubModule.cs .github/workflows/fix-mpc-vm-scope.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix MPC namespace scope and accessibility"
          git push origin mpc-full-rebuild-final
