name: Fix rebuild compile errors

on:
  push:
    branches:
      - rebuild/mpc-full-implementation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: rebuild/mpc-full-implementation
          fetch-depth: 0

      - name: Apply safe compile fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('rebuild/MultiplayerCampaignEnhancements.cs')
          s = p.read_text(encoding='utf-8')

          if 'using BinaryWriter = System.IO.BinaryWriter;' not in s:
              marker = 'using System.Text;\n'
              if marker in s:
                  s = s.replace(marker, marker + 'using BinaryWriter = System.IO.BinaryWriter;\nusing BinaryReader = System.IO.BinaryReader;\n', 1)
              else:
                  s = 'using BinaryWriter = System.IO.BinaryWriter;\nusing BinaryReader = System.IO.BinaryReader;\n' + s

          s = s.replace('WorldPartySyncState', 'WorldPartyState')

          # Remove the duplicated CampaignSystem using while preserving the first occurrence.
          first = 'using TaleWorlds.CampaignSystem;'
          pos = s.find(first)
          if pos >= 0:
              head = s[:pos + len(first)]
              tail = s[pos + len(first):]
              tail = tail.replace('\nusing TaleWorlds.CampaignSystem;\n', '\n', 1)
              s = head + tail

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebuild/MultiplayerCampaignEnhancements.cs
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix rebuild enhancement compile errors"
          git push origin HEAD:rebuild/mpc-full-implementation
