name: Fix MPC source

on:
  push:
    branches: [edit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 1

      - name: Apply compile fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('rebuild/MultiplayerCampaignSubModule.cs')
          s = p.read_text(encoding='utf-8-sig')

          # System.IO types take precedence over TaleWorlds.Library ambiguous types.
          if 'using BinaryReader = System.IO.BinaryReader;' not in s:
              s = s.replace('using System.IO;\n', 'using System.IO;\nusing BinaryReader = System.IO.BinaryReader;\n', 1)
          if 'using System.Reflection;' not in s:
              anchor = 'using System.IO;\n'
              s = s.replace(anchor, anchor + 'using System.Reflection;\n', 1)

          # Use the existing main-party helper instead of the incomplete compatibility wrapper.
          s = s.replace('SafeCampaignAccess\n                .TryGetMainPartyPosition(', 'CampaignWorld\n                .TryGetMainPartyPosition(')
          s = s.replace('SafeCampaignAccess\n                .GetMainPartySize()', 'CampaignWorld\n                .GetMainPartySize()')

          # World-party packet queue method in the actual synchronizer is EnqueueSnapshot.
          s = s.replace('WorldPartySynchronizer\n                    .QueueSnapshot(', 'WorldPartySynchronizer\n                    .EnqueueSnapshot(')

          # Remote player map registry removal is provided by the campaign-map registry.
          s = s.replace('RemotePlayerMapRegistry\n            .Remove(', 'CampaignMapRemotePlayerRegistry\n            .Remove(')
          s = s.replace('RemotePlayerMapRegistry\n                .Remove(', 'CampaignMapRemotePlayerRegistry\n                .Remove(')

          # Bannerlord 1.3.4 exposes SetCustomName through PartyBase in this source set.
          s = s.replace('Party.SetCustomName(new TextObject(MpcSession.Name))',
                        'Party.Party.SetCustomName(new TextObject(MpcSession.Name))')

          # Valid CampaignEvents load hook for Bannerlord 1.3.4.
          old = '''        CampaignEvents\n            .GameLoadFinishedEvent\n            .AddNonSerializedListener(\n                this,\n                OnGameLoadFinished\n            );'''
          new = '''        CampaignEvents\n            .OnGameLoadedEvent\n            .AddNonSerializedListener(\n                this,\n                _ => OnGameLoadFinished()\n            );'''
          s = s.replace(old, new)

          # Add Reset() to the existing snapshot send timer if absent.
          def inject_method(text, class_name, method):
              if re.search(r'(?m)^\s*(public|internal|private)\s+static\s+void\s+Reset\s*\(', text):
                  return text
              m = re.search(r'(?m)^\s*internal static class ' + re.escape(class_name) + r'\s*\{', text)
              if not m:
                  m = re.search(r'(?m)^\s*public static class ' + re.escape(class_name) + r'\s*\{', text)
              if not m:
                  raise SystemExit(f'class not found: {class_name}')
              start = m.end()-1
              depth=0; i=start
              while i < len(text):
                  if text[i]=='{': depth += 1
                  elif text[i]=='}':
                      depth -= 1
                      if depth==0:
                          return text[:i] + '\n' + method + '\n' + text[i:]
                  i += 1
              raise SystemExit(f'unclosed class: {class_name}')

          s = inject_method(s, 'PlayerSnapshotSendTimer', '''    public static void Reset()\n    {\n        _timer = 0f;\n    }''')

          # Add Remove() to the map registry where call sites require it.
          if not re.search(r'(?m)^\s*public static void Remove\(\s*string playerId\)', s):
              method = '''    public static void Remove(\n        string playerId)\n    {\n        if (string.IsNullOrWhiteSpace(playerId))\n            return;\n        lock (Sync)\n        {\n            Markers.Remove(playerId);\n        }\n    }'''
              s = inject_method(s, 'RemotePlayerMapRegistry', method)

          # CampaignWorld needs a boolean-safe position accessor.
          if 'bool\n        TryGetMainPartyPosition' not in s and 'TryGetMainPartyPosition(\n        out CampaignVec2' not in s:
              method = '''    public static bool TryGetMainPartyPosition(\n        out CampaignVec2 position)\n    {\n        try\n        {\n            MobileParty mainParty = MobileParty.MainParty;\n            if (mainParty != null)\n            {\n                position = mainParty.Position;\n                return true;\n            }\n        }\n        catch\n        {\n        }\n        position = new CampaignVec2(new Vec2(0f, 0f), true);\n        return false;\n    }'''
              s = inject_method(s, 'CampaignWorld', method)

          # Only Reset is required by the existing cleanup call sites.
          if 'class PlayerIdentity' not in s:
              marker = 'namespace MultiplayerCampaignRebuildLayer'
              idx = s.find(marker)
              if idx < 0:
                  idx = len(s)
              addition = '''internal static class PlayerIdentity\n{\n    public static void Reset() { }\n}\n\ninternal static class RemotePlayerMapMarkerCleanup\n{\n    public static void Remove(string playerId)\n    {\n        if (string.IsNullOrWhiteSpace(playerId)) return;\n        CampaignMapRemotePlayerRegistry.Remove(playerId);\n    }\n}\n\n'''
              s = s[:idx] + addition + s[idx:]

          # Replace any stale reflection namespace import mistakes.
          p.write_text(s, encoding='utf-8')
          print('compile fixes applied')

      - name: Commit source fixes
        shell: pwsh
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add rebuild/MultiplayerCampaignSubModule.cs
          git commit -m 'Fix Bannerlord 1.3.4 compile issues' || exit 0
          git push origin HEAD:edit

      - name: Prepare reference DLLs
        shell: pwsh
        run: |
          $base = 'https://raw.githubusercontent.com/mohammadrezaRX/ChatGPT/main/DLLs'
          $dlls = @('0Harmony.dll','SandBox.dll','TaleWorlds.CampaignSystem.dll','TaleWorlds.Core.dll','TaleWorlds.Engine.GauntletUI.dll','TaleWorlds.Engine.dll','TaleWorlds.GauntletUI.Data.dll','TaleWorlds.GauntletUI.dll','TaleWorlds.Library.dll','TaleWorlds.Localization.dll','TaleWorlds.MountAndBlade.View.dll','TaleWorlds.MountAndBlade.ViewModelCollection.dll','TaleWorlds.MountAndBlade.dll','TaleWorlds.ObjectSystem.dll','TaleWorlds.SaveSystem.dll','TaleWorlds.ScreenSystem.dll')
          New-Item -ItemType Directory -Path DLLs -Force | Out-Null
          foreach ($dll in $dlls) { Invoke-WebRequest -UseBasicParsing "$base/$dll" -OutFile "DLLs/$dll" }

      - name: Rewrite CI-local reference paths
        shell: pwsh
        run: |
          $p='rebuild\MultiplayerCampaignRebuild.csproj'
          $s=Get-Content $p -Raw
          $s=$s -replace '\$\(BannerlordRoot\)', '..\DLLs'
          $s=$s -replace '<HintPath>\.\.\\DLLs\\Modules\\Bannerlord\.Harmony\\bin\\Win64_Shipping_Client\\0Harmony\.dll</HintPath>', '<HintPath>..\DLLs\0Harmony.dll</HintPath>'
          $s=$s -replace '<HintPath>\.\.\\DLLs\\Modules\\Native\\bin\\Win64_Shipping_Client\\TaleWorlds\.MountAndBlade\.View\.dll</HintPath>', '<HintPath>..\DLLs\TaleWorlds.MountAndBlade.View.dll</HintPath>'
          $s=$s -replace '<HintPath>\.\.\\DLLs\\Modules\\SandBox\\bin\\Win64_Shipping_Client\\SandBox\.dll</HintPath>', '<HintPath>..\DLLs\SandBox.dll</HintPath>'
          Set-Content $p $s -Encoding utf8

      - name: Restore and build
        run: |
          dotnet restore rebuild\MultiplayerCampaignRebuild.csproj --nologo
          dotnet build rebuild\MultiplayerCampaignRebuild.csproj --no-restore --nologo --verbosity normal
