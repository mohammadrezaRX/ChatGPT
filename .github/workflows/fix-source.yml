name: Fix MPC source

on:
  push:
    branches: [edit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 1

      - name: Apply compile fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('rebuild/MultiplayerCampaignSubModule.cs')
          s = p.read_text(encoding='utf-8-sig')

          if 'using BinaryReader = System.IO.BinaryReader;' not in s:
              s = s.replace('using System.IO;\n', 'using System.IO;\nusing BinaryReader = System.IO.BinaryReader;\n', 1)
          if 'using System.Reflection;' not in s:
              s = s.replace('using System.IO;\n', 'using System.IO;\nusing System.Reflection;\n', 1)

          # Current Bannerlord CampaignEvents load event requires CampaignGameStarter argument.
          s = re.sub(r'private void OnGameLoaded\(\)', 'private void OnGameLoaded(CampaignGameStarter starter)', s)
          # Existing registrations may use the method group directly; bind explicitly and ignore the argument when needed.
          s = re.sub(r'(CampaignEvents\s*\.\s*OnGameLoadedEvent\s*\.\s*AddNonSerializedListener\s*\(\s*this\s*,\s*)OnGameLoaded\s*(\))', r'\1starter => OnGameLoaded(starter)\2', s)

          p.write_text(s, encoding='utf-8')
          print('Applied event callback signature fix.')

      - name: Commit source fix
        shell: pwsh
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add rebuild/MultiplayerCampaignSubModule.cs
          git commit -m 'Fix campaign load event callback signature' || exit 0
          git push origin HEAD:edit

      - name: Prepare reference DLLs
        shell: pwsh
        run: |
          $base = 'https://raw.githubusercontent.com/mohammadrezaRX/ChatGPT/main/DLLs'
          $dlls = @('0Harmony.dll','SandBox.dll','TaleWorlds.CampaignSystem.dll','TaleWorlds.Core.dll','TaleWorlds.Engine.GauntletUI.dll','TaleWorlds.Engine.dll','TaleWorlds.GauntletUI.Data.dll','TaleWorlds.GauntletUI.dll','TaleWorlds.Library.dll','TaleWorlds.Localization.dll','TaleWorlds.MountAndBlade.View.dll','TaleWorlds.MountAndBlade.ViewModelCollection.dll','TaleWorlds.MountAndBlade.dll','TaleWorlds.ObjectSystem.dll','TaleWorlds.SaveSystem.dll','TaleWorlds.ScreenSystem.dll')
          New-Item -ItemType Directory -Path DLLs -Force | Out-Null
          foreach ($dll in $dlls) { Invoke-WebRequest -UseBasicParsing "$base/$dll" -OutFile "DLLs/$dll" }

      - name: Rewrite CI-local reference paths
        shell: pwsh
        run: |
          $p='rebuild\MultiplayerCampaignRebuild.csproj'
          $s=Get-Content $p -Raw
          $s=$s -replace '\$\(BannerlordRoot\)', '..\DLLs'
          $s=$s -replace '<HintPath>\.\.\\DLLs\\Modules\\Bannerlord\.Harmony\\bin\\Win64_Shipping_Client\\0Harmony\.dll</HintPath>', '<HintPath>..\DLLs\0Harmony.dll</HintPath>'
          $s=$s -replace '<HintPath>\.\.\\DLLs\\Modules\\Native\\bin\\Win64_Shipping_Client\\TaleWorlds\.MountAndBlade\.View\.dll</HintPath>', '<HintPath>..\DLLs\TaleWorlds.MountAndBlade.View.dll</HintPath>'
          $s=$s -replace '<HintPath>\.\.\\DLLs\\Modules\\SandBox\\bin\\Win64_Shipping_Client\\SandBox\.dll</HintPath>', '<HintPath>..\DLLs\SandBox.dll</HintPath>'
          Set-Content $p $s -Encoding utf8

      - name: Restore and build
        run: |
          dotnet restore rebuild\MultiplayerCampaignRebuild.csproj --nologo
          dotnet build rebuild\MultiplayerCampaignRebuild.csproj --no-restore --nologo --verbosity normal
