name: Fix MPC source

on:
  push:
    branches: [edit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 1

      - name: Apply compile fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('rebuild/MultiplayerCampaignSubModule.cs')
          s = p.read_text(encoding='utf-8-sig')

          if 'using BinaryReader = System.IO.BinaryReader;' not in s:
              s = s.replace('using System.IO;\n', 'using System.IO;\nusing BinaryReader = System.IO.BinaryReader;\n', 1)
          if 'using System.Reflection;' not in s:
              s = s.replace('using System.IO;\n', 'using System.IO;\nusing System.Reflection;\n', 1)

          # Resolve stale helper call sites.
          s = re.sub(r'SafeCampaignAccess\s*\.\s*TryGetMainPartyPosition\s*\(', 'CampaignWorld.TryGetMainPartyPosition(', s)
          s = re.sub(r'SafeCampaignAccess\s*\.\s*GetMainPartySize\s*\(\s*\)', 'CampaignWorld.GetMainPartySize()', s)
          s = re.sub(r'WorldPartySynchronizer\s*\.\s*QueueSnapshot\s*\(', 'WorldPartySynchronizer.EnqueueSnapshot(', s)

          # Resolve the old load event API.
          s = re.sub(r'CampaignEvents\s*\.\s*GameLoadFinishedEvent', 'CampaignEvents.OnGameLoadedEvent', s)
          s = re.sub(r'\.AddNonSerializedListener\(\s*this,\s*OnGameLoadFinished\s*\)', '.AddNonSerializedListener(this, _ => OnGameLoadFinished())', s)

          # Fix stale FinalMasterUpdate reference inside FinalResetV2.
          s = s.replace('FinalMasterUpdate\n                    ._ResetInternal();', '_ResetInternal();')
          s = s.replace('FinalMasterUpdate._ResetInternal();', '_ResetInternal();')

          def find_class(text, name):
              m = re.search(r'(?m)^\s*(?:public|internal|private|protected)?\s*(?:sealed\s+|abstract\s+)?(?:static\s+)?class\s+' + re.escape(name) + r'\s*\{', text)
              if not m:
                  raise SystemExit(f'class not found: {name}')
              start = text.find('{', m.start())
              depth = 0
              i = start
              while i < len(text):
                  c = text[i]
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return m, start, i
                  i += 1
              raise SystemExit(f'unclosed class: {name}')

          def ensure_method(text, class_name, signature_prefix, method):
              m, start, end = find_class(text, class_name)
              body = text[start:end+1]
              if signature_prefix in body:
                  return text
              return text[:end] + '\n\n' + method + '\n' + text[end:]

          # CampaignWorld boolean-safe accessor.
          s = ensure_method(
              s,
              'CampaignWorld',
              'TryGetMainPartyPosition',
              '''    public static bool TryGetMainPartyPosition(\n        out CampaignVec2 position)\n    {\n        try\n        {\n            MobileParty mainParty = MobileParty.MainParty;\n            if (mainParty != null)\n            {\n                position = mainParty.Position;\n                return true;\n            }\n        }\n        catch\n        {\n        }\n        position = new CampaignVec2(new Vec2(0f, 0f), true);\n        return false;\n    }'''
          )

          # Reset belongs specifically to PlayerSnapshotSendTimer.
          s = ensure_method(
              s,
              'PlayerSnapshotSendTimer',
              'void Reset()',
              '''    public static void Reset()\n    {\n        _timer = 0f;\n    }'''
          )

          # Exact helper for SafeCampaignAccess call sites retained elsewhere.
          s = ensure_method(
              s,
              'SafeCampaignAccess',
              'GetMainPartySize',
              '''    public static int GetMainPartySize()\n    {\n        return CampaignWorld.GetMainPartySize();\n    }'''
          )

          p.write_text(s, encoding='utf-8')
          print('Applied targeted compile repairs.')

      - name: Commit source fixes
        shell: pwsh
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add rebuild/MultiplayerCampaignSubModule.cs
          git commit -m 'Fix MPC helper and event API errors' || exit 0
          git push origin HEAD:edit

      - name: Prepare reference DLLs
        shell: pwsh
        run: |
          $base = 'https://raw.githubusercontent.com/mohammadrezaRX/ChatGPT/main/DLLs'
          $dlls = @('0Harmony.dll','SandBox.dll','TaleWorlds.CampaignSystem.dll','TaleWorlds.Core.dll','TaleWorlds.Engine.GauntletUI.dll','TaleWorlds.Engine.dll','TaleWorlds.GauntletUI.Data.dll','TaleWorlds.GauntletUI.dll','TaleWorlds.Library.dll','TaleWorlds.Localization.dll','TaleWorlds.MountAndBlade.View.dll','TaleWorlds.MountAndBlade.ViewModelCollection.dll','TaleWorlds.MountAndBlade.dll','TaleWorlds.ObjectSystem.dll','TaleWorlds.SaveSystem.dll','TaleWorlds.ScreenSystem.dll')
          New-Item -ItemType Directory -Path DLLs -Force | Out-Null
          foreach ($dll in $dlls) { Invoke-WebRequest -UseBasicParsing "$base/$dll" -OutFile "DLLs/$dll" }

      - name: Rewrite CI-local reference paths
        shell: pwsh
        run: |
          $p='rebuild\MultiplayerCampaignRebuild.csproj'
          $s=Get-Content $p -Raw
          $s=$s -replace '\$\(BannerlordRoot\)', '..\DLLs'
          $s=$s -replace '<HintPath>\.\.\\DLLs\\Modules\\Bannerlord\.Harmony\\bin\\Win64_Shipping_Client\\0Harmony\.dll</HintPath>', '<HintPath>..\DLLs\0Harmony.dll</HintPath>'
          $s=$s -replace '<HintPath>\.\.\\DLLs\\Modules\\Native\\bin\\Win64_Shipping_Client\\TaleWorlds\.MountAndBlade\.View\.dll</HintPath>', '<HintPath>..\DLLs\TaleWorlds.MountAndBlade.View.dll</HintPath>'
          $s=$s -replace '<HintPath>\.\.\\DLLs\\Modules\\SandBox\\bin\\Win64_Shipping_Client\\SandBox\.dll</HintPath>', '<HintPath>..\DLLs\SandBox.dll</HintPath>'
          Set-Content $p $s -Encoding utf8

      - name: Restore and build
        run: |
          dotnet restore rebuild\MultiplayerCampaignRebuild.csproj --nologo
          dotnet build rebuild\MultiplayerCampaignRebuild.csproj --no-restore --nologo --verbosity normal
