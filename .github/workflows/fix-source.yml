name: Fix MPC source

on:
  push:
    branches: [edit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout edit
        uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 1

      - name: Download Bannerlord DLL references
        shell: pwsh
        run: |
          $base = 'https://raw.githubusercontent.com/mohammadrezaRX/ChatGPT/main/DLLs'
          $dlls = @(
            '0Harmony.dll','SandBox.dll','TaleWorlds.CampaignSystem.dll','TaleWorlds.Core.dll',
            'TaleWorlds.Engine.GauntletUI.dll','TaleWorlds.Engine.dll','TaleWorlds.GauntletUI.Data.dll',
            'TaleWorlds.GauntletUI.dll','TaleWorlds.Library.dll','TaleWorlds.Localization.dll',
            'TaleWorlds.MountAndBlade.View.dll','TaleWorlds.MountAndBlade.ViewModelCollection.dll',
            'TaleWorlds.MountAndBlade.dll','TaleWorlds.ObjectSystem.dll','TaleWorlds.SaveSystem.dll',
            'TaleWorlds.ScreenSystem.dll'
          )
          New-Item -ItemType Directory -Path DLLs -Force | Out-Null
          foreach ($dll in $dlls) {
            Invoke-WebRequest -UseBasicParsing -Uri "$base/$dll" -OutFile "DLLs/$dll"
          }

      - name: Apply MCC reconnect, transfer and Party A/B fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('rebuild/MultiplayerCampaignSubModule.cs')
          s = p.read_text(encoding='utf-8-sig')
          original = s

          # 1) Client reconnect: a stale non-connected task must not block a new connect attempt.
          old = '''                if (_connectionRunning)\n                {\n                    return;\n                }\n\n                DisconnectInternal();'''
          new = '''                if (_connectionRunning && IsConnected)\n                {\n                    return;\n                }\n\n                DisconnectInternal();'''
          if old not in s:
              raise SystemExit('connect guard block not found')
          s = s.replace(old, new, 1)

          # 2) Clear client transfer/remote state on every disconnect.
          old = '''            _connectionRunning =\n                false;\n\n            while (\n                _incoming.TryDequeue(\n                    out _))'''
          new = '''            _connectionRunning =\n                false;\n\n            try\n            {\n                MultiplayerWorldTransfer.Clear();\n            }\n            catch\n            {\n            }\n\n            try\n            {\n                RemotePlayerManager.Clear();\n            }\n            catch\n            {\n            }\n\n            while (\n                _incoming.TryDequeue(\n                    out _))'''
          if old not in s:
              raise SystemExit('disconnect cleanup block not found')
          s = s.replace(old, new, 1)

          # 3) WorldComplete must only mark ready after the transfer is complete and validated.
          old = '''                case NetworkPacketType.WorldComplete:\n                    _worldReady = true;\n\n                    MultiplayerWorldTransfer\n                        .HandleWorldComplete(\n                            message.Payload\n                        );\n                    break;'''
          new = '''                case NetworkPacketType.WorldComplete:\n                    MultiplayerWorldTransfer\n                        .HandleWorldComplete(\n                            message.Payload\n                        );\n\n                    _worldReady =\n                        MultiplayerWorldTransfer.IsComplete;\n                    break;'''
          if old not in s:
              raise SystemExit('world complete block not found')
          s = s.replace(old, new, 1)

          # 4) Replace fake MCC payload with the actual MCC save file bytes.
          pattern = r'''    private static byte\[\] BuildWorldTransferData\(\)\n    \{.*?\n    \}\n\n\n    /\*\n     \* ========================================================\n     \* READY'''
          replacement = '''    private static byte[] BuildWorldTransferData()\n    {\n        try\n        {\n            string saveDirectory =\n                FilePaths.SavePath.Path;\n\n            if (string.IsNullOrWhiteSpace(saveDirectory))\n            {\n                return null;\n            }\n\n            string[] candidates =\n            {\n                Path.Combine(saveDirectory, HostSaveName + ".sav"),\n                Path.Combine(saveDirectory, HostSaveName)\n            };\n\n            for (int i = 0; i < candidates.Length; i++)\n            {\n                string file = candidates[i];\n\n                if (!File.Exists(file))\n                {\n                    continue;\n                }\n\n                FileInfo info =\n                    new FileInfo(file);\n\n                if (info.Length <= 0 ||\n                    info.Length > 512L * 1024L * 1024L)\n                {\n                    continue;\n                }\n\n                return File.ReadAllBytes(file);\n            }\n        }\n        catch (Exception ex)\n        {\n            HostConsole.WriteLine(\n                "[!] MCC save read error: " +\n                ex.Message\n            );\n        }\n\n        return null;\n    }\n\n\n    /*\n     * ========================================================\n     * READY'''
          s2, count = re.subn(pattern, replacement, s, flags=re.S)
          if count != 1:
              raise SystemExit(f'world transfer method replacement count={count}')
          s = s2

          # 5) Replace client FinishClientLoad with a real save-backed Campaign load.
          pattern = r'''    public static void FinishClientLoad\(\)\n    \{.*?\n    \}\n\n\n    public static byte\[\] GetReceivedWorld'''
          replacement = '''    public static void FinishClientLoad()\n    {\n        byte[] world;\n\n        lock (Sync)\n        {\n            if (!_complete || _worldData == null || _worldData.Length == 0)\n            {\n                return;\n            }\n\n            world =\n                (byte[])_worldData.Clone();\n\n            _worldData = null;\n            _complete = false;\n        }\n\n        try\n        {\n            string saveDirectory =\n                FilePaths.SavePath.Path;\n\n            if (string.IsNullOrWhiteSpace(saveDirectory))\n            {\n                throw new InvalidOperationException(\n                    "Save directory unavailable."\n                );\n            }\n\n            Directory.CreateDirectory(saveDirectory);\n\n            string transferName =\n                "MPC_NETWORK_TRANSFER";\n\n            string transferPath =\n                Path.Combine(\n                    saveDirectory,\n                    transferName + ".sav"\n                );\n\n            File.WriteAllBytes(\n                transferPath,\n                world\n            );\n\n            LoadResult result =\n                MBSaveLoad.LoadSaveGameData(\n                    transferName\n                );\n\n            if (result == null || !result.Successful)\n            {\n                throw new InvalidOperationException(\n                    "Transferred MCC save could not be loaded."\n                );\n            }\n\n            MultiplayerCampaignSubModule\n                .BeginTransferredWorldLoad();\n\n            MBGameManager.StartNewGame(\n                new SandBoxGameManager(result)\n            );\n\n            HostConsole.WriteLine(\n                "[*] MCC transfer load started."\n            );\n        }\n        catch (Exception ex)\n        {\n            MultiplayerCampaignSubModule\n                .EndTransferredWorldLoad();\n\n            HostConsole.WriteLine(\n                "[!] MCC transfer load error: " +\n                ex.Message\n            );\n        }\n    }\n\n\n    public static byte[] GetReceivedWorld'''
          s2, count = re.subn(pattern, replacement, s, flags=re.S)
          if count != 1:
              raise SystemExit(f'finish client load replacement count={count}')
          s = s2

          # 6) Mark the new Client Campaign as loaded once Campaign.Current is the transferred Campaign.
          marker = '''        public void Disconnect()\n        {'''
          insert = '''        public void MarkWorldLoaded()\n        {\n            _worldLoaded = true;\n            _worldReady = false;\n        }\n\n        public void Disconnect()\n        {'''
          if marker not in s:
              raise SystemExit('client disconnect marker not found')
          s = s.replace(marker, insert, 1)

          # 7) Finish the transferred Campaign on the Campaign/Game thread and create Party B.
          old = '''            if (\n                MultiplayerNetworkClient\n                    .Instance\n                    .IsWorldLoaded)\n            {\n                _worldInitialized = true;\n            }'''
          new = '''            if (\n                MultiplayerCampaignSubModule\n                    .IsLoadingTransferredWorld() &&\n                Campaign.Current != null &&\n                MobileParty.MainParty != null)\n            {\n                MultiplayerNetworkClient\n                    .Instance\n                    .MarkWorldLoaded();\n\n                MultiplayerCampaignSubModule\n                    .EndTransferredWorldLoad();\n\n                _worldInitialized = true;\n            }\n            else if (\n                MultiplayerNetworkClient\n                    .Instance\n                    .IsWorldLoaded)\n            {\n                _worldInitialized = true;\n            }'''
          if old not in s:
              raise SystemExit('world initialized block not found')
          s = s.replace(old, new, 1)

          # 8) Never fall back from the Client Party to the Host MainParty.
          old = '''            MobileParty party = MpcClientParty.ActiveParty;\n            if (party == null || party == MobileParty.MainParty)\n                party = MobileParty.MainParty;\n\n            if (party == null)\n                return;'''
          new = '''            MobileParty party = MpcClientParty.ActiveParty;\n\n            if (party == null)\n                return;'''
          if old not in s:
              raise SystemExit('client party fallback block not found')
          s = s.replace(old, new, 1)

          # 9) Make MpcClientParty persistent and explicitly promote Party B to the local MainParty.
          old = '''                if (Party != null && Party != MobileParty.MainParty)\n                    return Party;'''
          new = '''                if (Party != null)\n                    return Party;'''
          if old not in s:
              raise SystemExit('client party persistence block not found')
          s = s.replace(old, new, 1)

          old = '''                    if (Party != null)\n                    {\n                        try { Party.Party.SetCustomName(new TextObject(MpcSession.Name)); } catch { }\n                    }\n\n                    return Party;'''
          new = '''                    if (Party != null)\n                    {\n                        try\n                        {\n                            Party.Party.SetCustomName(\n                                new TextObject(MpcSession.Name)\n                            );\n                        }\n                        catch { }\n\n                        try\n                        {\n                            Party.SetAsMainParty();\n                        }\n                        catch { }\n                    }\n\n                    return Party;'''
          if old not in s:
              raise SystemExit('client party creation block not found')
          s = s.replace(old, new, 1)

          # 10) Capture the actual party size instead of always querying MainParty.
          old = '''                PartySize = Math.Max(1, Math.Min(10000, CampaignWorld.GetMainPartySize())),'''
          new = '''                PartySize =\n                    Math.Max(\n                        1,\n                        Math.Min(\n                            10000,\n                            party.MemberRoster != null\n                                ? party.MemberRoster.TotalManCount\n                                : 1\n                        )\n                    ),'''
          if old not in s:
              raise SystemExit('party size capture block not found')
          s = s.replace(old, new, 1)

          # 11) Remove dead clients before enforcing the single-remote-client limit.
          old = '''                lock (_sync)\n                {\n                    /*\n                     * The target build is two-player.\n                     *\n                     * Existing host is player one.\n                     * Only one remote client is required.\n                     */\n\n                    if (_clients.Count >= 1)\n                    {\n                        SendErrorAndClose(\n                            client,\n                            "Server is full."\n                        );\n\n                        continue;\n                    }\n\n                    _clients.Add(\n                        client\n                    );\n                }'''
          new = '''                bool serverFull;\n\n                lock (_sync)\n                {\n                    for (int i = _clients.Count - 1; i >= 0; i--)\n                    {\n                        HostClientConnection existing = _clients[i];\n\n                        if (existing == null || !existing.IsConnected)\n                        {\n                            _clients.RemoveAt(i);\n                        }\n                    }\n\n                    serverFull = _clients.Count >= 1;\n\n                    if (!serverFull)\n                    {\n                        _clients.Add(\n                            client\n                        );\n                    }\n                }\n\n                if (serverFull)\n                {\n                    SendErrorAndClose(\n                        client,\n                        "Server is full."\n                    );\n\n                    continue;\n                }'''
          if old not in s:
              raise SystemExit('accept-loop capacity block not found')
          s = s.replace(old, new, 1)

          # 12) Remove the host connection from the registry immediately on Close.
          old = '''        try\n        {\n            _client?.Close();\n        }\n        catch\n        {\n        }\n    }'''
          new = '''        try\n        {\n            _client?.Close();\n        }\n        catch\n        {\n        }\n\n        try\n        {\n            _host?.RemoveClient(this);\n        }\n        catch\n        {\n        }\n    }'''
          if old not in s:
              raise SystemExit('host close block not found')
          s = s.replace(old, new, 1)

          # Safety checks: do not write if the file was not changed as expected.
          if s == original:
              raise SystemExit('no source changes were produced')

          p.write_text(s, encoding='utf-8')
          print('Applied MCC transfer, reconnect, and Party A/B fixes.')

      - name: Verify rebuild contains exactly three files
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path rebuild -File -Recurse | Where-Object { $_.FullName -notmatch '\\bin\\|\\obj\\' })
          $allowed = @(
            'rebuild\MultiplayerCampaignSubModule.cs',
            'rebuild\MultiplayerCampaignRebuild.csproj',
            'rebuild\MultiplayerCampaign.xml'
          )
          foreach ($f in $files) {
            $rel = $f.FullName.Substring((Get-Location).Path.Length + 1)
            if ($allowed -notcontains $rel) { throw "Unexpected file in rebuild: $rel" }
          }
          if ($files.Count -ne 3) { throw "Expected 3 rebuild files, found $($files.Count)." }

      - name: Rewrite CI-local reference paths
        shell: pwsh
        run: |
          $p='rebuild\MultiplayerCampaignRebuild.csproj'
          $s=Get-Content $p -Raw
          $s=$s -replace '\$\(BannerlordRoot\)', '..\DLLs'
          $s=$s -replace '<HintPath>\.\.\\DLLs\\Modules\\Bannerlord\.Harmony\\bin\\Win64_Shipping_Client\\0Harmony\.dll</HintPath>', '<HintPath>..\DLLs\0Harmony.dll</HintPath>'
          $s=$s -replace '<HintPath>\.\.\\DLLs\\Modules\\Native\\bin\\Win64_Shipping_Client\\TaleWorlds\.MountAndBlade\.View\.dll</HintPath>', '<HintPath>..\DLLs\TaleWorlds.MountAndBlade.View.dll</HintPath>'
          $s=$s -replace '<HintPath>\.\.\\DLLs\\Modules\\SandBox\\bin\\Win64_Shipping_Client\\SandBox\.dll</HintPath>', '<HintPath>..\DLLs\SandBox.dll</HintPath>'
          Set-Content $p $s -Encoding utf8

      - name: Restore
        run: dotnet restore rebuild\MultiplayerCampaignRebuild.csproj --nologo

      - name: Build
        run: dotnet build rebuild\MultiplayerCampaignRebuild.csproj --no-restore --nologo --verbosity normal

      - name: Upload DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MultiplayerCampaign-edit-dll
          path: rebuild\bin\Debug\netstandard2.0\MultiplayerCampaign.dll
          if-no-files-found: error

      - name: Commit source changes
        shell: pwsh
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add rebuild/MultiplayerCampaignSubModule.cs
          git diff --cached --quiet; if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'Fix MCC reconnect and independent client party lifecycle'
          git push origin HEAD:edit
