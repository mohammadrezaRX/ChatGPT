name: Fix MPC source

on:
  push:
    branches: [edit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 1

      - name: Apply structural C# fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('rebuild/MultiplayerCampaignSubModule.cs')
          s = p.read_text(encoding='utf-8-sig')

          # First RemotePlayerManager declaration must be the other half of the later partial declaration.
          matches = list(re.finditer(r'(?m)^public static class RemotePlayerManager\s*$', s))
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one exact non-partial RemotePlayerManager declaration, found {len(matches)}')
          s = s[:matches[0].start()] + 'public static partial class RemotePlayerManager' + s[matches[0].end():]

          # Keep these APIs internal because their types are internal implementation details.
          old = 'public void Send(\n            NetworkPacketType type,'
          new = 'internal void Send(\n            NetworkPacketType type,'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one NetworkPacketType Send signature, found {s.count(old)}')
          s = s.replace(old, new, 1)

          old = 'public HostClientConnection[] GetClientsSnapshot()'
          new = 'internal HostClientConnection[] GetClientsSnapshot()'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one GetClientsSnapshot signature, found {s.count(old)}')
          s = s.replace(old, new, 1)

          # Rebuild layer is a sibling namespace.
          marker = 'namespace MultiplayerCampaignRebuildLayer\n{'
          if marker not in s:
              raise SystemExit('Rebuild layer namespace marker not found')
          prefix = 'using MultiplayerCampaign;\n\n' + marker
          if prefix not in s:
              s = s.replace(marker, prefix, 1)

          p.write_text(s, encoding='utf-8')
          print('Applied structural fixes; no brace edits.')

      - name: Commit fixes
        shell: pwsh
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add rebuild/MultiplayerCampaignSubModule.cs
          git commit -m 'Fix MPC source namespace and declarations' || exit 0
          git push origin HEAD:edit
