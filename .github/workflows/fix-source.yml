name: Fix MPC source

on:
  push:
    branches: [edit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 1

      - name: Apply structural C# fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('rebuild/MultiplayerCampaignSubModule.cs')
          s = p.read_text(encoding='utf-8-sig')

          old = 'public static class RemotePlayerManager'
          new = 'public static partial class RemotePlayerManager'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one non-partial RemotePlayerManager, found {s.count(old)}')
          s = s.replace(old, new, 1)

          old = 'public void Send(\n            NetworkPacketType type,'
          new = 'internal void Send(\n            NetworkPacketType type,'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one NetworkPacketType Send signature, found {s.count(old)}')
          s = s.replace(old, new, 1)

          old = 'public HostClientConnection[] GetClientsSnapshot()'
          new = 'internal HostClientConnection[] GetClientsSnapshot()'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one GetClientsSnapshot signature, found {s.count(old)}')
          s = s.replace(old, new, 1)

          marker = 'namespace MultiplayerCampaignRebuildLayer\n{'
          if marker not in s:
              raise SystemExit('Rebuild layer namespace marker not found')
          if 'using MultiplayerCampaign;\n\n' + marker not in s:
              s = s.replace(marker, 'using MultiplayerCampaign;\n\n' + marker, 1)

          p.write_text(s, encoding='utf-8')
          print('Applied structural fixes; brace structure unchanged.')

      - name: Commit fixes
        shell: pwsh
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add rebuild/MultiplayerCampaignSubModule.cs
          git commit -m 'Fix MPC namespace and accessibility errors' || exit 0
          git push origin HEAD:edit
