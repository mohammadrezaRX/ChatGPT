name: Fix MPC source

on:
  push:
    branches: [edit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 1

      - name: Apply structural C# fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('rebuild/MultiplayerCampaignSubModule.cs')
          s = p.read_text(encoding='utf-8-sig')

          matches = list(re.finditer(r'(?m)^public static class RemotePlayerManager\s*$', s))
          if len(matches) == 1:
              m = matches[0]
              s = s[:m.start()] + 'public static partial class RemotePlayerManager' + s[m.end():]
          elif len(matches) != 0:
              raise SystemExit(f'Unexpected non-partial RemotePlayerManager count: {len(matches)}')

          old = 'public void Send(\n            NetworkPacketType type,'
          new = 'internal void Send(\n            NetworkPacketType type,'
          if old in s:
              s = s.replace(old, new, 1)

          old = 'public HostClientConnection[] GetClientsSnapshot()'
          new = 'internal HostClientConnection[] GetClientsSnapshot()'
          if old in s:
              s = s.replace(old, new, 1)

          # Remove any previous misplaced using inserted in the middle of the file.
          s = s.replace('\nusing MultiplayerCampaign;\n\nnamespace MultiplayerCampaignRebuildLayer',
                        '\nnamespace MultiplayerCampaignRebuildLayer', 1)

          # Add the sibling namespace import at compilation-unit scope.
          if not re.search(r'(?m)^using MultiplayerCampaign;\s*$', s):
              first_using = re.search(r'(?m)^using\s+System;', s)
              if not first_using:
                  raise SystemExit('Could not find compilation-unit using section')
              s = s[:first_using.start()] + 'using MultiplayerCampaign;\n' + s[first_using.start():]

          p.write_text(s, encoding='utf-8')
          print('Applied structural fixes. No brace changes.')

      - name: Commit fixes
        shell: pwsh
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add rebuild/MultiplayerCampaignSubModule.cs
          git commit -m 'Fix MPC source type visibility' || exit 0
          git push origin HEAD:edit
