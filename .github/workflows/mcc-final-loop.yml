name: MPC build loop

on:
  workflow_dispatch:
  push:
    branches: [edit]

permissions:
  contents: read

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download Bannerlord DLLs
        shell: pwsh
        run: |
          $base = 'https://raw.githubusercontent.com/mohammadrezaRX/ChatGPT/main/DLLs'
          $names = @(
            '0Harmony.dll','SandBox.dll','TaleWorlds.CampaignSystem.dll','TaleWorlds.Core.dll',
            'TaleWorlds.Engine.GauntletUI.dll','TaleWorlds.Engine.dll','TaleWorlds.GauntletUI.Data.dll',
            'TaleWorlds.GauntletUI.dll','TaleWorlds.Library.dll','TaleWorlds.Localization.dll',
            'TaleWorlds.MountAndBlade.View.dll','TaleWorlds.MountAndBlade.ViewModelCollection.dll',
            'TaleWorlds.MountAndBlade.dll','TaleWorlds.ObjectSystem.dll','TaleWorlds.SaveSystem.dll',
            'TaleWorlds.ScreenSystem.dll'
          )
          New-Item -ItemType Directory -Force DLLs | Out-Null
          foreach ($name in $names) { Invoke-WebRequest -UseBasicParsing "$base/$name" -OutFile "DLLs/$name" }

      - name: Replace source with known-good complete revision
        shell: pwsh
        run: |
          $url = 'https://raw.githubusercontent.com/mohammadrezaRX/ChatGPT/2012e47e079005129d9b5b87a28651f53b7e42bb/rebuild/MultiplayerCampaignSubModule.cs'
          Invoke-WebRequest -UseBasicParsing $url -OutFile 'rebuild\MultiplayerCampaignSubModule.cs'

      - name: Apply reconnect and Party A/B fixes
        shell: pwsh
        run: |
          @'
from pathlib import Path
import re

p = Path(r"rebuild\MultiplayerCampaignSubModule.cs")
s = p.read_text(encoding="utf-8-sig")

def replace_once(old, new, label):
    global s
    if old not in s:
        raise SystemExit(f"pattern not found: {label}")
    s = s.replace(old, new, 1)
    print(label)

replace_once(
'''                if (_connectionRunning)
                {
                    return;
                }

                DisconnectInternal();''',
'''                if (_connectionRunning && IsConnected)
                {
                    return;
                }

                DisconnectInternal();''',
"client-connect-guard")

replace_once(
'''            _connectionRunning =
                false;

            while (
                _incoming.TryDequeue(
                    out _))''',
'''            _connectionRunning =
                false;

            try { MultiplayerWorldTransfer.Clear(); } catch { }
            try { RemotePlayerManager.Clear(); } catch { }
            try { WorldRevisionState.Clear(); } catch { }

            while (
                _incoming.TryDequeue(
                    out _))''',
"client-cleanup")

replace_once(
'''                    if (_clients.Count >= 1)
                    {
                        SendErrorAndClose(
                            client,
                            "Server is full."
                        );

                        continue;
                    }''',
'''                    if (_clients.Count >= 1)
                    {
                        for (int i = _clients.Count - 1; i >= 0; i--)
                        {
                            HostClientConnection stale = _clients[i];
                            if (stale == null || !stale.IsConnected)
                            {
                                _clients.RemoveAt(i);
                                try { stale?.Close(); } catch { }
                            }
                        }

                        if (_clients.Count >= 1)
                        {
                            SendErrorAndClose(
                                client,
                                "Server is full."
                            );

                            continue;
                        }
                    }''',
"host-reclaim-stale")

# Add host unregister to HostClientConnection.Close().
start = s.find("internal sealed class HostClientConnection")
if start < 0:
    raise SystemExit("HostClientConnection not found")
pos = s.find("public void Close()", start)
if pos < 0:
    raise SystemExit("Close not found")
brace = s.find("{", pos)
depth = 0
end = -1
for i in range(brace, len(s)):
    if s[i] == "{": depth += 1
    elif s[i] == "}":
        depth -= 1
        if depth == 0:
            end = i + 1
            break
if end < 0:
    raise SystemExit("Close scope not found")
close = s[pos:end]
if "_host?.RemoveClient(this)" not in close:
    close = close[:-1] + '''

        try
        {
            _host?.RemoveClient(this);
        }
        catch
        {
        }
    }'''
    s = s[:pos] + close + s[end:]

replace_once(
'''                case NetworkPacketType.WorldComplete:
                    _worldReady = true;

                    MultiplayerWorldTransfer
                        .HandleWorldComplete(
                            message.Payload
                        );
                    break;''',
'''                case NetworkPacketType.WorldComplete:
                    MultiplayerWorldTransfer
                        .HandleWorldComplete(
                            message.Payload
                        );
                    _worldReady = MultiplayerWorldTransfer.IsComplete;
                    break;''',
"world-complete-gate")

replace_once(
'''            MobileParty party = MpcClientParty.ActiveParty;
            if (party == null || party == MobileParty.MainParty)
                party = MobileParty.MainParty;

            if (party == null)
                return;''',
'''            MobileParty party = MpcClientParty.ActiveParty;
            if (party == null || party == MobileParty.MainParty)
                return;''',
"client-party-no-host-fallback")

replace_once(
'''                PartySize = Math.Max(1, Math.Min(10000, CampaignWorld.GetMainPartySize())),''',
'''                PartySize = Math.Max(1, Math.Min(10000, party.MemberRoster != null ? party.MemberRoster.TotalManCount : 1)),''',
"client-party-size")

# Replace automatic slot-0 creation with a strict selected-slot requirement.
pattern = re.compile(r'''        public static void SelectOrCreateIdentityFromCurrentPlayer\(\)\s*\{.*?^        \}\s*\n    \}\s*\n\s*internal sealed class PlayerSyncState''', re.S | re.M)
replacement = '''        public static void SelectOrCreateIdentityFromCurrentPlayer()
        {
            CharacterSlotStore.EnsureLoaded();

            CharacterSlotData selected = null;
            lock (Sync)
            {
                if (SelectedSlot >= 0 && SelectedSlot < 3)
                    selected = CharacterSlotStore.Get(SelectedSlot);
            }

            if (selected == null || !selected.IsValid)
                return;

            lock (Sync)
            {
                CharacterId = selected.CharacterId;
                CharacterName = selected.Name;
            }

            LocalPlayerState.SetDisplayName(CharacterName);
        }
    }

    internal sealed class PlayerSyncState'''
s, n = pattern.subn(replacement, s, count=1)
if n != 1:
    raise SystemExit("strict slot identity patch failed")

# Make VM partial so the UI slot surface can be added without duplicating the main VM.
if "public sealed class MultiplayerCampaignVM" in s:
    s = s.replace("public sealed class MultiplayerCampaignVM", "public sealed partial class MultiplayerCampaignVM", 1)

# Add partial VM slot surface only once.
if "MPC_THREE_CHARACTER_SLOTS_V1" not in s:
    s += '''

// ============================================================
// MPC_THREE_CHARACTER_SLOTS_V1
// ============================================================

namespace MultiplayerCampaign
{
    public sealed partial class MultiplayerCampaignVM
    {
        private bool _showSlots;

        [DataSourceProperty]
        public bool ShowSlots
        {
            get { return _showSlots; }
            private set
            {
                if (_showSlots == value) return;
                _showSlots = value;
                OnPropertyChangedWithValue(value, nameof(ShowSlots));
            }
        }

        [DataSourceProperty]
        public string Slot1Text { get { return BuildSlotText(0); } }
        [DataSourceProperty]
        public string Slot2Text { get { return BuildSlotText(1); } }
        [DataSourceProperty]
        public string Slot3Text { get { return BuildSlotText(2); } }

        public void ExecuteOpenCharacterSlots()
        {
            ShowMain = false;
            ShowCreate = false;
            ShowJoin = false;
            ShowSlots = true;
            CharacterSlotStore.EnsureLoaded();
            OnPropertyChanged(nameof(Slot1Text));
            OnPropertyChanged(nameof(Slot2Text));
            OnPropertyChanged(nameof(Slot3Text));
        }

        public void ExecuteSelectSlot1() { SelectSlotForJoin(0); }
        public void ExecuteSelectSlot2() { SelectSlotForJoin(1); }
        public void ExecuteSelectSlot3() { SelectSlotForJoin(2); }

        private static string BuildSlotText(int slot)
        {
            CharacterSlotData data = CharacterSlotStore.Get(slot);
            if (data == null || !data.IsValid)
                return "SLOT " + (slot + 1) + " - EMPTY / CREATE CHARACTER";
            return "SLOT " + (slot + 1) + " - " + (data.Name ?? "Player");
        }

        private void SelectSlotForJoin(int slot)
        {
            CharacterSlotStore.EnsureLoaded();
            CharacterSlotData data = CharacterSlotStore.Get(slot);
            if (data == null || !data.IsValid)
            {
                StatusText = "CHARACTER CREATION REQUIRED";
                return;
            }

            if (!MpcSession.SelectSlot(slot))
            {
                StatusText = "CHARACTER SLOT SELECT FAILED";
                return;
            }

            LocalPlayerState.SetDisplayName(MpcSession.Name);
            ShowSlots = false;
            ShowJoin = true;
            ShowCreate = false;
            ShowMain = false;
            StatusText = "SLOT " + (slot + 1) + " SELECTED";
        }
    }
}
'''

if s.count('{') != s.count('}'):
    raise SystemExit(f"unbalanced braces: {s.count('{')} vs {s.count('}')}")

p.write_text(s, encoding="utf-8")
'@ | Set-Content patch.py -Encoding utf8
          python patch.py

      - name: Replace UI with complete three-slot flow
        shell: pwsh
        run: |
          @'
<Window>
    <Widget WidthSizePolicy="StretchToParent" HeightSizePolicy="StretchToParent" Sprite="background_1">
        <Children>
            <Widget WidthSizePolicy="StretchToParent" HeightSizePolicy="StretchToParent" Sprite="BlankWhiteSquare" AlphaFactor="0.35"></Widget>
            <Widget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="950" SuggestedHeight="760" HorizontalAlignment="Center" VerticalAlignment="Center" Sprite="frame_001_9" IsVisible="@ShowMain">
                <Children>
                    <TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="Fixed" SuggestedHeight="70" MarginTop="55" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="FullScreenNotice.Title" Text="MULTIPLAYER CAMPAIGN"></TextWidget>
                    <TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="Fixed" SuggestedHeight="40" MarginTop="120" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="FullScreenNotice.Text" Text="LAN CAMPAIGN"></TextWidget>
                    <ButtonWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="520" SuggestedHeight="95" MarginTop="205" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="ButtonBrush" Command.Click="ExecuteOpenCreate"><Children><TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="StretchToParent" HorizontalAlignment="Center" VerticalAlignment="Center" Brush="FullScreenNotice.Text" Text="CREATE HOST"></TextWidget></Children></ButtonWidget>
                    <ButtonWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="520" SuggestedHeight="95" MarginTop="325" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="ButtonBrush" Command.Click="ExecuteOpenCharacterSlots"><Children><TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="StretchToParent" HorizontalAlignment="Center" VerticalAlignment="Center" Brush="FullScreenNotice.Text" Text="JOIN HOST"></TextWidget></Children></ButtonWidget>
                    <ButtonWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="220" SuggestedHeight="65" MarginBottom="55" HorizontalAlignment="Center" VerticalAlignment="Bottom" Brush="ButtonBrush" Command.Click="ExecuteBack"><Children><TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="StretchToParent" HorizontalAlignment="Center" VerticalAlignment="Center" Brush="FullScreenNotice.Text" Text="‹ BACK"></TextWidget></Children></ButtonWidget>
                </Children>
