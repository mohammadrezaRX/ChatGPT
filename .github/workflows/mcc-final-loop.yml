name: MPC Build
on:
  push:
    branches: [edit]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout edit
        uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Import Bannerlord DLLs from main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main --depth=1
          git checkout origin/main -- DLLs
          if (!(Test-Path DLLs)) { throw 'DLLs directory is missing' }
          git restore --staged DLLs 2>$null
      - name: Thematic modular split
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project tools/RoslynSplitter/RoslynSplitter.csproj -- rebuild rebuild
          if (!(Test-Path rebuild/REFACTOR_MAP.txt)) { throw 'Thematic split failed' }
      - name: Verify source layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem rebuild -Filter *.cs -File)
          if ($files.Count -ne 10) { throw "Expected 10 thematic C# files, got $($files.Count)" }
          if (!(Test-Path rebuild/MultiplayerCampaignRebuild.csproj)) { throw 'Build project is missing' }
      - name: Restore
        shell: pwsh
        run: dotnet restore rebuild/MultiplayerCampaignRebuild.csproj --verbosity normal
      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build rebuild/MultiplayerCampaignRebuild.csproj --configuration Release --no-restore --verbosity normal 2>&1 | Tee-Object build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify success
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path rebuild/bin/Release/netstandard2.0/MultiplayerCampaign.dll)) { throw 'Release DLL was not produced.' }
          $m = Select-String -Path build.log -Pattern '(?i): error |error\s*CS[0-9]+'
          $count = if ($m) { @($m).Count } else { 0 }
          Write-Host "ERRORS = $count"
          if ($count -ne 0) { throw "Build log contains $count error(s)." }
          Write-Host 'BUILD SUCCESS'
