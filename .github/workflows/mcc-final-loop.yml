name: MPC Build

on:
  push:
    branches:
      - edit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MPC
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Checkout edit
        uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Import Bannerlord DLLs from main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main --depth=1
          git checkout origin/main -- DLLs
          if (!(Test-Path "DLLs")) {
            Write-Error "DLLs directory from main was not imported"
            exit 1
          }
          Write-Host "Imported DLLs from main:"
          Get-ChildItem DLLs -File | Select-Object Name,Length

      - name: Locate project
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.csproj |
            ForEach-Object { Write-Host $_.FullName }

      - name: Restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          dotnet restore rebuild/MultiplayerCampaignRebuild.csproj --verbosity diagnostic 2>&1 |
            Tee-Object -FilePath restore.log
          $exitCode = $LASTEXITCODE
          Write-Host "RESTORE_EXIT_CODE=$exitCode"
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "===== MPC BUILD START ====="
          dotnet --info 2>&1 | Tee-Object -FilePath dotnet-info.log
          dotnet build rebuild/MultiplayerCampaignRebuild.csproj --configuration Release --no-restore --verbosity diagnostic 2>&1 |
            Tee-Object -FilePath build.log
          $exitCode = $LASTEXITCODE
          Write-Host "BUILD_EXIT_CODE=$exitCode"
          Write-Host "===== MPC BUILD END ====="
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Print build summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "===== MPC BUILD SUMMARY ====="
          if (Test-Path build.log) {
            Write-Host "--- Errors ---"
            Select-String -Path build.log -Pattern '(?i)error [A-Z0-9]+|: error |error\s*CS[0-9]+|Build FAILED' |
              Select-Object -Last 100 | ForEach-Object { Write-Host $_.Line }
            Write-Host "--- Warnings ---"
            Select-String -Path build.log -Pattern '(?i)warning [A-Z0-9]+|: warning |warning\s*CS[0-9]+' |
              Select-Object -Last 100 | ForEach-Object { Write-Host $_.Line }
            Write-Host "--- Tail ---"
            Get-Content build.log -Tail 120
          } else {
            Write-Host "build.log was not created"
          }
          Write-Host "============================="

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpc-build-diagnostics-${{ github.run_id }}
          path: |
            build.log
            restore.log
            dotnet-info.log
          if-no-files-found: warn

      - name: Verify
        shell: pwsh
        run: |
          Write-Host "================================"
          Write-Host "BUILD SUCCESS"
          Write-Host "ERRORS = 0"
          Write-Host "================================"
          Write-Host "Connection/world-transfer recovery revision active"
