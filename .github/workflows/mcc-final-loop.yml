name: MPC strict build loop

on:
  workflow_dispatch:
  push:
    branches: [edit]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout edit
        uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download Bannerlord references
        shell: pwsh
        run: |
          $base = 'https://raw.githubusercontent.com/mohammadrezaRX/ChatGPT/main/DLLs'
          $names = @(
            '0Harmony.dll','SandBox.dll','TaleWorlds.CampaignSystem.dll','TaleWorlds.Core.dll',
            'TaleWorlds.Engine.GauntletUI.dll','TaleWorlds.Engine.dll','TaleWorlds.GauntletUI.Data.dll',
            'TaleWorlds.GauntletUI.dll','TaleWorlds.Library.dll','TaleWorlds.Localization.dll',
            'TaleWorlds.MountAndBlade.View.dll','TaleWorlds.MountAndBlade.ViewModelCollection.dll',
            'TaleWorlds.MountAndBlade.dll','TaleWorlds.ObjectSystem.dll','TaleWorlds.SaveSystem.dll',
            'TaleWorlds.ScreenSystem.dll'
          )
          New-Item -ItemType Directory -Force rebuild | Out-Null
          New-Item -ItemType Directory -Force rebuild\DLLs | Out-Null
          foreach ($name in $names) {
            Invoke-WebRequest -UseBasicParsing -Uri "$base/$name" -OutFile "rebuild\DLLs\$name"
          }

      - name: Use root source as the only build source
        shell: pwsh
        run: |
          Copy-Item 'MultiplayerCampaignSubModule.cs' 'rebuild\MultiplayerCampaignSubModule.cs' -Force

      - name: Validate source
        shell: pwsh
        run: |
          $source = Get-Content 'rebuild\MultiplayerCampaignSubModule.cs' -Raw
          $open = ([regex]::Matches($source, '\{')).Count
          $close = ([regex]::Matches($source, '\}')).Count
          if ($open -ne $close) { throw "Unbalanced braces: $open / $close" }

      - name: Restore
        shell: pwsh
        run: dotnet restore rebuild\MultiplayerCampaignRebuild.csproj --nologo

      - name: Build
        shell: pwsh
        run: dotnet build rebuild\MultiplayerCampaignRebuild.csproj --no-restore --nologo --verbosity minimal

      - name: Upload verified DLL
        uses: actions/upload-artifact@v4
        with:
          name: MultiplayerCampaign-edit-verified
          path: rebuild/bin/Debug/netstandard2.0/MultiplayerCampaign.dll
          if-no-files-found: error
