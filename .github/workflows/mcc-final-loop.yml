name: MPC authoritative build loop

on:
  push:
    branches: [edit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout edit
        uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download Bannerlord references
        shell: pwsh
        run: |
          $base='https://raw.githubusercontent.com/mohammadrezaRX/ChatGPT/main/DLLs'
          $dlls=@('0Harmony.dll','SandBox.dll','TaleWorlds.CampaignSystem.dll','TaleWorlds.Core.dll','TaleWorlds.Engine.GauntletUI.dll','TaleWorlds.Engine.dll','TaleWorlds.GauntletUI.Data.dll','TaleWorlds.GauntletUI.dll','TaleWorlds.Library.dll','TaleWorlds.Localization.dll','TaleWorlds.MountAndBlade.View.dll','TaleWorlds.MountAndBlade.ViewModelCollection.dll','TaleWorlds.MountAndBlade.dll','TaleWorlds.ObjectSystem.dll','TaleWorlds.SaveSystem.dll','TaleWorlds.ScreenSystem.dll')
          New-Item -ItemType Directory DLLs -Force | Out-Null
          foreach($dll in $dlls){ Invoke-WebRequest -UseBasicParsing "$base/$dll" -OutFile "DLLs/$dll" }

      - name: Replace source with clean known-good revision
        shell: pwsh
        run: |
          $url='https://raw.githubusercontent.com/mohammadrezaRX/ChatGPT/2012e47e079005129d9b5b87a28651f53b7e42bb/rebuild/MultiplayerCampaignSubModule.cs'
          Invoke-WebRequest -UseBasicParsing $url -OutFile rebuild\MultiplayerCampaignSubModule.cs

          $p='rebuild\MultiplayerCampaignSubModule.cs'
          $s=Get-Content $p -Raw

          # Make VM extensible without touching its existing logic.
          $s=$s.Replace('public sealed class MultiplayerCampaignVM','public sealed partial class MultiplayerCampaignVM')

          # Reconnect: a stale async receive loop must never block a fresh connect attempt.
          $old='''                if (_connectionRunning)\n                {\n                    return;\n                }\n\n                DisconnectInternal();'''
          $new='''                if (_connectionRunning && IsConnected)\n                {\n                    return;\n                }\n\n                DisconnectInternal();'''
          $s=$s.Replace($old,$new,1)

          # Client cleanup: clear per-session queues/state before a new connection.
          $old='''            _connectionRunning =\n                false;\n\n            while (\n                _incoming.TryDequeue(\n                    out _))'''
          $new='''            _connectionRunning =\n                false;\n\n            try { MultiplayerWorldTransfer.Clear(); } catch { }\n            try { RemotePlayerManager.Clear(); } catch { }\n            try { WorldRevisionState.Clear(); } catch { }\n\n            while (\n                _incoming.TryDequeue(\n                    out _))'''
          $s=$s.Replace($old,$new,1)

          # Host accepts one remote player, reclaiming dead connections first.
          $pattern='(?s)                    if \(_clients\.Count >= 1\)\s*\{\s*SendErrorAndClose\(\s*client,\s*"Server is full\."\s*\);\s*continue;\s*\}'
          $replacement='''                    if (_clients.Count >= 1)\n                    {\n                        for (int i = _clients.Count - 1; i >= 0; i--)\n                        {\n                            HostClientConnection existing = _clients[i];\n                            if (existing == null || !existing.IsConnected)\n                            {\n                                _clients.RemoveAt(i);\n                                try { existing?.Close(); } catch { }\n                            }\n                        }\n\n                        if (_clients.Count >= 1)\n                        {\n                            SendErrorAndClose(\n                                client,\n                                "Server is full."\n                            );\n\n                            continue;\n                        }\n                    }'''
          $s=[regex]::Replace($s,$pattern,$replacement,1)

          # Host connection closes immediately unregister itself.
          $hostStart=$s.IndexOf('internal sealed class HostClientConnection')
          if($hostStart -lt 0){throw 'HostClientConnection class not found'}
          $closePos=$s.IndexOf('public void Close()', $hostStart)
          if($closePos -lt 0){throw 'HostClientConnection.Close not found'}
          $brace=$s.IndexOf('{',$closePos)
          $depth=0; $end=-1
          for($i=$brace;$i -lt $s.Length;$i++){
            if($s[$i] -eq '{'){$depth++}
            elseif($s[$i] -eq '}'){ $depth--; if($depth -eq 0){$end=$i+1;break} }
          }
          if($end -lt 0){throw 'Close method scope not found'}
          $closeBlock=$s.Substring($closePos,$end-$closePos)
          if($closeBlock -notmatch '_host\?\.RemoveClient'){
            $closeBlock2=$closeBlock -replace '(?s)(try\s*\{\s*_client\?\.Close\(\);\s*\}\s*catch\s*\{\s*\})', '$1\r\n\r\n        try\r\n        {\r\n            _host?.RemoveClient(this);\r\n        }\r\n        catch\r\n        {\r\n        }'
            $s=$s.Substring(0,$closePos)+$closeBlock2+$s.Substring($end)
          }

          # World transfer: never send dummy bytes; use provider or MCC save.
          $worldPattern='(?s)    private static byte\[\] BuildWorldTransferData\(\)\s*\{.*?^    \}\s*\n\s*/\*\s*\n\s*\* ========================================================\s*\n\s*\* READY'
          $worldReplacement='''    private static byte[] BuildWorldTransferData()\n    {\n        try\n        {\n            byte[] existing = ExistingWorldTransferProvider.TryGetWorldData();\n            if (existing != null && existing.Length > 0)\n                return existing;\n\n            string root = FilePaths.SavePath.Path;\n            if (string.IsNullOrWhiteSpace(root))\n                return null;\n\n            string[] files =\n            {\n                Path.Combine(root, MultiplayerCampaignSubModule.HostSaveName + ".sav"),\n                Path.Combine(root, MultiplayerCampaignSubModule.HostSaveName)\n            };\n\n            foreach (string file in files)\n            {\n                if (!File.Exists(file))\n                    continue;\n\n                FileInfo info = new FileInfo(file);\n                if (info.Length <= 0 || info.Length > 512L * 1024L * 1024L)\n                    continue;\n\n                return File.ReadAllBytes(file);\n            }\n        }\n        catch (Exception ex)\n        {\n            HostConsole.WriteLine("[!] MCC save read error: " + ex.Message);\n        }\n\n        return null;\n    }\n\n\n    /*\n     * ========================================================\n     * READY'''
          $s=[regex]::Replace($s,$worldPattern,$worldReplacement,1)

          # Client MCC completion loads the received save through Bannerlord's normal save loader.
          $finishPattern='(?s)    public static void FinishClientLoad\(\)\s*\{.*?^    \}\s*\n\s*public static byte\[\] GetReceivedWorld'
          $finishReplacement='''    public static void FinishClientLoad()\n    {\n        byte[] world;\n\n        lock (Sync)\n        {\n            if (!_complete || _worldData == null || _worldData.Length == 0)\n                return;\n\n            world = (byte[])_worldData.Clone();\n            _worldData = null;\n            _complete = false;\n        }\n\n        try\n        {\n            string root = FilePaths.SavePath.Path;\n            if (string.IsNullOrWhiteSpace(root))\n                throw new InvalidOperationException("Save path unavailable.");\n\n            Directory.CreateDirectory(root);\n            string name = "MPC_NETWORK_TRANSFER";\n            string path = Path.Combine(root, name + ".sav");\n            File.WriteAllBytes(path, world);\n\n            LoadResult result = MBSaveLoad.LoadSaveGameData(name);\n            if (result == null || !result.Successful)\n                throw new InvalidOperationException("Transferred MCC save could not be loaded.");\n\n            MultiplayerCampaignSubModule.BeginTransferredWorldLoad();\n            MBGameManager.StartNewGame(new SandBoxGameManager(result));\n            HostConsole.WriteLine("[*] MCC transfer load requested.");\n        }\n        catch (Exception ex)\n        {\n            MultiplayerCampaignSubModule.EndTransferredWorldLoad();\n            HostConsole.WriteLine("[!] MCC client load error: " + ex.Message);\n        }\n    }\n\n\n    public static byte[] GetReceivedWorld'''
          $s=[regex]::Replace($s,$finishPattern,$finishReplacement,1)

          # Do not mark the transfer ready until Campaign.Current is live.
          $loadedPattern='(?s)private void OnGameLoaded\(CampaignGameStarter starter\)\s*\{.*?CampaignSafeStartup\s*\.Update\(\);'
          $loadedReplace='''private void OnGameLoaded(CampaignGameStarter starter)\n    {\n        if (Campaign.Current == null)\n            return;\n\n        try\n        {\n            CampaignSafeStartup.Update();'''
          $s=[regex]::Replace($s,$loadedPattern,$loadedReplace,1)
          $needle='''            MultiplayerCampaignGameState\n                .SetCampaignReady(\n                    Campaign.Current != null &&\n                    Hero.MainHero != null &&\n                    MobileParty.MainParty != null\n                );'''
          $insert='''            MultiplayerCampaignGameState\n                .SetCampaignReady(\n                    Campaign.Current != null &&\n                    Hero.MainHero != null &&\n                    MobileParty.MainParty != null\n                );'''
          $s=$s.Replace($needle,$insert,1)

          # Client Party must never use Host MainParty.
          $clientParty='''            MobileParty party = MpcClientParty.ActiveParty;\n            if (party == null || party == MobileParty.MainParty)\n                party = MobileParty.MainParty;\n\n            if (party == null)\n                return;'''
          $clientPartyNew='''            MobileParty party = MpcClientParty.ActiveParty;\n            if (party == null || party == MobileParty.MainParty)\n                return;'''
          $s=$s.Replace($clientParty,$clientPartyNew,1)

          # Client party size is its own roster.
          $s=$s.Replace('PartySize = Math.Max(1, Math.Min(10000, CampaignWorld.GetMainPartySize())),','PartySize = Math.Max(1, Math.Min(10000, party.MemberRoster != null ? party.MemberRoster.TotalManCount : 1)),',1)

          # Replace automatic slot 0 creation with a strict selected-slot requirement.
          $sessionPattern='(?s)        public static void SelectOrCreateIdentityFromCurrentPlayer\(\)\s*\{.*?^        \}\s*\n    \}\s*\n\s*internal sealed class PlayerSyncState'
          $sessionReplace='''        public static void SelectOrCreateIdentityFromCurrentPlayer()\n        {\n            CharacterSlotStore.EnsureLoaded();\n\n            CharacterSlotData selected = null;\n            lock (Sync)\n            {\n                if (SelectedSlot >= 0 && SelectedSlot < 3)\n                    selected = CharacterSlotStore.Get(SelectedSlot);\n            }\n\n            if (selected == null || !selected.IsValid)\n                return;\n\n            lock (Sync)\n            {\n                CharacterId = selected.CharacterId;\n                CharacterName = selected.Name;\n            }\n\n            LocalPlayerState.SetDisplayName(CharacterName);\n        }\n    }\n\n    internal sealed class PlayerSyncState'''
          $s=[regex]::Replace($s,$sessionPattern,$sessionReplace,1)

          Set-Content $p $s -Encoding utf8

          # Structural sanity check before compilation.
          if(($s.ToCharArray() | Where-Object {$_ -eq '{'}).Count -ne ($s.ToCharArray() | Where-Object {$_ -eq '}'}).Count){throw 'Unbalanced source braces'}

      - name: Validate requested rebuild layout
        shell: pwsh
        run: |
          $files=@(Get-ChildItem rebuild -File -Recurse | Where-Object {$_.FullName -notmatch '\\bin\\|\\obj\\'})
          $allowed=@('rebuild\MultiplayerCampaignSubModule.cs','rebuild\MultiplayerCampaignRebuild.csproj','rebuild\MultiplayerCampaign.xml')
          if($files.Count -ne 3){throw "Expected exactly 3 rebuild files; found $($files.Count)"}
          foreach($f in $files){$rel=$f.FullName.Substring((Get-Location).Path.Length+1);if($allowed -notcontains $rel){throw "Unexpected rebuild file: $rel"}}

      - name: Restore and compile
        shell: pwsh
        run: |
          dotnet restore rebuild\MultiplayerCampaignRebuild.csproj --nologo
          dotnet build rebuild\MultiplayerCampaignRebuild.csproj --no-restore --nologo --verbosity minimal

      - name: Upload verified DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MultiplayerCampaign-edit-verified
          path: rebuild\bin\Debug\netstandard2.0\MultiplayerCampaign.dll
          if-no-files-found: error
