name: MPC build loop

on:
  workflow_dispatch:
  push:
    branches: [edit]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout edit
        uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Create CI project
        shell: pwsh
        run: |
          @'
<Project Sdk="Microsoft.NET.Sdk">
  <PropertyGroup>
    <TargetFramework>netstandard2.0</TargetFramework>
    <LangVersion>latest</LangVersion>
    <Nullable>disable</Nullable>
    <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
    <AssemblyName>MultiplayerCampaign</AssemblyName>
    <RootNamespace>MultiplayerCampaign</RootNamespace>
    <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
  </PropertyGroup>
  <ItemGroup>
    <Compile Include="MultiplayerCampaignSubModule.cs" />
    <PackageReference Include="Bannerlord.ReferenceAssemblies" Version="1.3.12.104914" />
    <PackageReference Include="Lib.Harmony.Ref" Version="2.3.4" />
  </ItemGroup>
</Project>
'@ | Set-Content CI.csproj -Encoding UTF8

      - name: Stage root source
        shell: pwsh
        run: Copy-Item 'MultiplayerCampaignSubModule.cs' 'MultiplayerCampaignSubModule.cs' -Force

      - name: Validate source structure
        shell: pwsh
        run: |
          $source = Get-Content 'MultiplayerCampaignSubModule.cs' -Raw
          $open = ([regex]::Matches($source, '\{')).Count
          $close = ([regex]::Matches($source, '\}')).Count
          if ($open -ne $close) { throw "Unbalanced braces: $open / $close" }
          foreach ($required in @(
            'class MultiplayerCampaignSubModule',
            'class MultiplayerCampaignBehavior',
            'class MultiplayerNetworkClient',
            'class MultiplayerCampaignHost',
            'class MpcClientParty',
            'class CharacterSlotStore')) {
            if ($source -notmatch $required) { throw "Missing required type: $required" }
          }

      - name: Restore
        shell: pwsh
        run: dotnet restore CI.csproj --nologo

      - name: Build
        shell: pwsh
        run: dotnet build CI.csproj --no-restore --nologo --verbosity normal

      - name: Publish verified DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MultiplayerCampaign-verified
          path: bin/Debug/netstandard2.0/MultiplayerCampaign.dll
          if-no-files-found: error
