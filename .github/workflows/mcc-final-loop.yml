name: MPC final repair loop
on:
  push:
    branches: [edit]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore known-good source and build
        shell: pwsh
        run: |
          $src='https://raw.githubusercontent.com/mohammadrezaRX/ChatGPT/2012e47e079005129d9b5b87a28651f53b7e42bb/rebuild/MultiplayerCampaignSubModule.cs'
          Invoke-WebRequest -UseBasicParsing $src -OutFile rebuild\MultiplayerCampaignSubModule.cs
          $base='https://raw.githubusercontent.com/mohammadrezaRX/ChatGPT/main/DLLs'
          $dlls=@('0Harmony.dll','SandBox.dll','TaleWorlds.CampaignSystem.dll','TaleWorlds.Core.dll','TaleWorlds.Engine.GauntletUI.dll','TaleWorlds.Engine.dll','TaleWorlds.GauntletUI.Data.dll','TaleWorlds.GauntletUI.dll','TaleWorlds.Library.dll','TaleWorlds.Localization.dll','TaleWorlds.MountAndBlade.View.dll','TaleWorlds.MountAndBlade.ViewModelCollection.dll','TaleWorlds.MountAndBlade.dll','TaleWorlds.ObjectSystem.dll','TaleWorlds.SaveSystem.dll','TaleWorlds.ScreenSystem.dll')
          New-Item DLLs -ItemType Directory -Force | Out-Null
          foreach($d in $dlls){Invoke-WebRequest -UseBasicParsing "$base/$d" -OutFile "DLLs/$d"}
          dotnet restore rebuild\MultiplayerCampaignRebuild.csproj --nologo
          dotnet build rebuild\MultiplayerCampaignRebuild.csproj --no-restore --nologo --verbosity minimal
      - name: Commit known-good source when build succeeds
        if: success()
        shell: pwsh
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add rebuild\MultiplayerCampaignSubModule.cs
          if(-not (git diff --cached --quiet)){git commit -m 'Restore compile-clean multiplayer campaign source'; git push origin HEAD:edit}
      - name: Upload DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MultiplayerCampaign-edit-verified
          path: rebuild\bin\Debug\netstandard2.0\MultiplayerCampaign.dll
          if-no-files-found: error
