# repair-loop-trigger
name: MPC strict build loop

on:
  workflow_dispatch:
  push:
    branches: [edit]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout edit
        uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Repair MCC connection and character pipeline
        shell: pwsh
        run: |
          $path = 'MultiplayerCampaignSubModule.cs'
          $source = Get-Content $path -Raw
          $source = $source -replace "`r`n", "`n"
          $changed = $false

          # 1) Allow a stale client connection attempt to be cancelled and retried.
          $source2 = [regex]::Replace($source, '(?ms)if \(_connectionRunning\)\s*\{\s*return;\s*\}\s*\n\s*DisconnectInternal\(\);', @'
          if (_connectionRunning)
          {
              bool transportAlive = false;
              try
              {
                  transportAlive = _tcpClient != null && _tcpClient.Connected;
              }
              catch
              {
                  transportAlive = false;
              }

              if (transportAlive)
              {
                  return;
              }

              DisconnectInternal();
          }
          else
          {
              DisconnectInternal();
          }
          '@, 1)
          if ($source2 -ne $source) { $source = $source2; $changed = $true }

          # 2) Replace the no-op MCC completion with an actual save-backed Campaign load.
          $pattern = '(?s)public static void FinishClientLoad\(\)\s*\{.*?\n\s*\}\s*\n\s*public static byte\[\] GetReceivedWorld'
          $replacement = @'
          public static void FinishClientLoad()
          {
              byte[] world;

              lock (Sync)
              {
                  if (!_complete || _worldData == null)
                      return;

                  world = _worldData;
                  _worldData = null;
                  _complete = false;
              }

              MultiplayerCampaignSubModule.BeginTransferredWorldLoad();

              try
              {
                  if (!MBSaveLoad.IsSaveGameFileExists("MCC"))
                  {
                      HostConsole.WriteLine("[!] MCC save is missing on Client.");
                      MultiplayerCampaignSubModule.EndTransferredWorldLoad();
                      MultiplayerNetworkClient.Instance.Disconnect();
                      return;
                  }

                  LoadResult result = MBSaveLoad.LoadSaveGameData("MCC");
                  if (result == null || !result.Successful)
                  {
                      HostConsole.WriteLine("[!] Client could not load MCC.");
                      MultiplayerCampaignSubModule.EndTransferredWorldLoad();
                      MultiplayerNetworkClient.Instance.Disconnect();
                      return;
                  }

                  SandBoxGameManager manager = new SandBoxGameManager(result);
                  MBGameManager.StartNewGame(manager);
                  HostConsole.WriteLine("[*] Client MCC Campaign load started.");
              }
              catch (Exception ex)
              {
                  HostConsole.WriteLine("[!] Client MCC load error: " + ex.Message);
                  MultiplayerCampaignSubModule.EndTransferredWorldLoad();
                  MultiplayerNetworkClient.Instance.Disconnect();
              }
          }


          public static byte[] GetReceivedWorld'@
          $updated = [regex]::Replace($source, $pattern, $replacement, 1)
          if ($updated -eq $source) { throw 'FinishClientLoad replacement target was not found.' }
          $source = $updated
          $changed = $true

          # 3) Mark the client world loaded only after the saved Campaign has finished loading.
          if (-not $source.Contains('public void MarkWorldLoaded()'))
          {
              $needle = 'public void Disconnect()'
              $insert = @'
          public void MarkWorldLoaded()
          {
              _worldLoaded = true;
              _worldReady = false;
              MultiplayerConnectionStatus.Set(MultiplayerConnectionState.Ready);
              _vm?.SetStatus("CONNECTED - MCC LOADED");
              MultiplayerCampaignSubModule.EndTransferredWorldLoad();
              try { SendPlayerReady(); } catch { }
          }


          public void Disconnect()
          '@
              if ($source.Contains($needle)) {
                  $source = $source.Replace($needle, $insert.TrimStart("`n"))
                  $changed = $true
              }
          }

          # 4) Never fall back from Client Party B to Host MainParty for outbound state.
          $pattern = '(?ms)MobileParty party = MpcClientParty\.ActiveParty;\s*if \(party == null \|\| party == MobileParty\.MainParty\)\s*party = MobileParty\.MainParty;'
          $replacement = 'MobileParty party = MpcClientParty.ActiveParty;\n            if (party == null || party == MobileParty.MainParty)\n                return;'
          $updated = [regex]::Replace($source, $pattern, $replacement, 1)
          if ($updated -ne $source) { $source = $updated; $changed = $true }

          # 5) Capture actual party roster size.
          $old = 'PartySize = Math.Max(1, Math.Min(10000, CampaignWorld.GetMainPartySize())),'
          $new = 'PartySize = Math.Max(1, Math.Min(10000, party.MemberRoster != null ? party.MemberRoster.TotalManCount : 1)),'
          if ($source.Contains($old)) { $source = $source.Replace($old, $new); $changed = $true }

          # 6) Remove stale host connections before the one-client capacity check.
          $pattern = '(?ms)lock \(_sync\)\s*\{\s*/\*\s*\* The target build is two-player\..*?if \(_clients\.Count >= 1\)\s*\{.*?\}\s*_clients\.Add\(\s*client\s*\);\s*\}'
          $replacement = @'
          lock (_sync)
          {
              for (int i = _clients.Count - 1; i >= 0; i--)
              {
                  HostClientConnection stale = _clients[i];
                  if (stale == null || !stale.IsConnected)
                      _clients.RemoveAt(i);
              }

              if (_clients.Count >= 1)
              {
                  SendErrorAndClose(client, "Server is full.");
                  continue;
              }

              _clients.Add(client);
          }
          '@
          $updated = [regex]::Replace($source, $pattern, $replacement, 1)
          if ($updated -ne $source) { $source = $updated; $changed = $true }

          # 7) Launch vanilla Character Creation after MCC loads if the Client has no selected character.
          if (-not $source.Contains('internal static class MpcFinalMccCharacterBridge'))
          {
              $append = @'


namespace MultiplayerCampaign
{
    internal static class MpcFinalMccCharacterBridge
    {
        [HarmonyLib.HarmonyPatch(typeof(SandBox.SandBoxGameManager), "OnLoadFinished")]
        private static class SandBoxLoadFinishedPatch
        {
            private static void Postfix()
            {
                try
                {
                    if (!MultiplayerCampaignSubModule.IsLoadingTransferredWorld())
                        return;

                    bool hasCharacter = false;
                    try { hasCharacter = MultiplayerCampaignRebuildLayer.MpcSession.HasSlot; }
                    catch { hasCharacter = false; }

                    if (!hasCharacter)
                    {
                        Game.Current.GameStateManager.CleanAndPushState(
                            Game.Current.GameStateManager.CreateState<
                                TaleWorlds.CampaignSystem.CharacterCreationContent.CharacterCreationState>(),
                            0
                        );
                        return;
                    }

                    MultiplayerNetworkClient.Instance.MarkWorldLoaded();
                    try { MultiplayerCampaignRebuildLayer.MpcClientParty.Ensure(); } catch { }
                }
                catch (Exception ex)
                {
                    HostConsole.WriteLine("[!] MCC completion bridge error: " + ex.Message);
                    try { MultiplayerNetworkClient.Instance.Disconnect(); } catch { }
                }
            }
        }

        [HarmonyLib.HarmonyPatch(
            typeof(TaleWorlds.CampaignSystem.CharacterCreationContent.CharacterCreationState),
            "FinalizeCharacterCreation"
        )]
        private static class CharacterCreationFinishedPatch
        {
            private static void Postfix()
            {
                try
                {
                    MultiplayerCampaignRebuildLayer.MpcSession.SelectOrCreateIdentityFromCurrentPlayer();
                    MultiplayerNetworkClient.Instance.MarkWorldLoaded();
                    MultiplayerCampaignRebuildLayer.MpcClientParty.Ensure();
                }
                catch (Exception ex)
                {
                    HostConsole.WriteLine("[!] Character creation completion error: " + ex.Message);
                }
            }
        }
    }
}
'@
              $source += $append
              $changed = $true
          }

          if ($changed)
          {
              [System.IO.File]::WriteAllText($path, $source + "`n", (New-Object System.Text.UTF8Encoding($false)))
              Write-Host 'Source repair changes prepared.'
          }
          else
          {
              Write-Host 'Source already contains this repair set.'
          }

      - name: Stage root source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force rebuild | Out-Null
          Copy-Item 'MultiplayerCampaignSubModule.cs' 'rebuild\MultiplayerCampaignSubModule.cs' -Force

      - name: Create CI reference project
        shell: pwsh
        run: |
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <LangVersion>latest</LangVersion>
              <Nullable>disable</Nullable>
              <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
              <AssemblyName>MultiplayerCampaign</AssemblyName>
              <RootNamespace>MultiplayerCampaign</RootNamespace>
              <GenerateAssemblyInfo>true</GenerateAssemblyInfo>
              <AppendTargetFrameworkToOutputPath>false</AppendTargetFrameworkToOutputPath>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="MultiplayerCampaignSubModule.cs" />
              <PackageReference Include="Bannerlord.ReferenceAssemblies" Version="1.3.12.104914" />
              <PackageReference Include="Lib.Harmony.Ref" Version="2.3.4" />
            </ItemGroup>
          </Project>
          '@ | Set-Content 'rebuild\CI.csproj' -Encoding UTF8

      - name: Validate braces
        shell: pwsh
        run: |
          $source = Get-Content 'rebuild\MultiplayerCampaignSubModule.cs' -Raw
          $open = ([regex]::Matches($source, '\{')).Count
          $close = ([regex]::Matches($source, '\}')).Count
          if ($open -ne $close) { throw "Unbalanced braces: $open / $close" }

      - name: Restore
        shell: pwsh
        run: dotnet restore rebuild\CI.csproj --nologo

      - name: Build
        shell: pwsh
        run: dotnet build rebuild\CI.csproj --no-restore --nologo --verbosity normal

      - name: Upload verified DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MultiplayerCampaign-edit-verified
          path: rebuild/bin/Debug/MultiplayerCampaign.dll
          if-no-files-found: error

      - name: Commit verified source replacement
        if: success()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MultiplayerCampaignSubModule.cs
          if (git diff --cached --quiet) {
            Write-Host 'No source changes to commit.'
            exit 0
          }
          git commit -m 'repair MCC connection and character creation pipeline'
          git push origin HEAD:edit
