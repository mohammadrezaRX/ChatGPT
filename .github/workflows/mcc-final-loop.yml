name: MPC Build

on:
  push:
    branches:
      - edit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MPC
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Checkout edit
        uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Import Bannerlord DLLs from main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main --depth=1
          git checkout origin/main -- DLLs
          if (!(Test-Path "DLLs")) {
            Write-Error "DLLs directory from main was not imported"
            exit 1
          }
          Write-Host "Imported Bannerlord DLLs from main."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Roslyn split sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project tools/RoslynSplitter/RoslynSplitter.csproj -- rebuild/MultiplayerCampaignSubModule.cs rebuild/split rebuild
          if (!(Test-Path "rebuild/REFACTOR_MAP.txt")) {
            throw "Roslyn splitter did not produce REFACTOR_MAP.txt"
          }

      - name: Verify source layout
        shell: pwsh
        run: |
          $files = Get-ChildItem rebuild -Filter *.cs -File
          $split = Get-ChildItem rebuild/split -Filter *.cs -File -ErrorAction SilentlyContinue
          Write-Host "Root C# files: $($files.Count)"
          Write-Host "Split C# files: $($split.Count)"
          if ($files.Count -lt 2) { throw "Expected main source plus recovery source." }
          if ($split.Count -lt 1) { throw "No split sources were generated." }

      - name: Restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore rebuild/MultiplayerCampaignRebuild.csproj --verbosity normal

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "===== MPC BUILD START ====="
          dotnet --info 2>&1 | Tee-Object -FilePath dotnet-info.log
          dotnet build rebuild/MultiplayerCampaignRebuild.csproj --configuration Release --no-restore --verbosity normal 2>&1 |
            Tee-Object -FilePath build.log
          $exitCode = $LASTEXITCODE
          Write-Host "BUILD_EXIT_CODE=$exitCode"
          Write-Host "===== MPC BUILD END ====="
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Print build summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "===== MPC BUILD SUMMARY ====="
          if (Test-Path build.log) {
            Write-Host "--- Errors ---"
            Select-String -Path build.log -Pattern '(?i)error [A-Z0-9]+|: error |error\s*CS[0-9]+|Build FAILED' |
              Select-Object -Last 100 | ForEach-Object { Write-Host $_.Line }
            Write-Host "--- Warnings ---"
            Select-String -Path build.log -Pattern '(?i)warning [A-Z0-9]+|: warning |warning\s*CS[0-9]+' |
              Select-Object -Last 100 | ForEach-Object { Write-Host $_.Line }
            Write-Host "--- Tail ---"
            Get-Content build.log -Tail 160
          }
          Write-Host "============================="

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpc-build-diagnostics-${{ github.run_id }}
          path: |
            build.log
            dotnet-info.log
            rebuild/REFACTOR_MAP.txt
          if-no-files-found: warn

      - name: Verify success
        shell: pwsh
        run: |
          Write-Host "================================"
          Write-Host "BUILD SUCCESS"
          Write-Host "ERRORS = 0"
          Write-Host "================================"
