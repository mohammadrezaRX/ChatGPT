name: MPC Build

on:
  push:
    branches:
      - edit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MPC
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: edit

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Locate project
        shell: pwsh
        run: |
          Write-Host "=== PROJECT FILES ==="
          Get-ChildItem -Recurse -Filter *.csproj |
            ForEach-Object { Write-Host $_.FullName }

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore rebuild/MultiplayerCampaignRebuild.csproj `
            --verbosity normal

      - name: Build
        shell: pwsh
        run: |
          dotnet build rebuild/MultiplayerCampaignRebuild.csproj `
            --configuration Release `
            --no-restore `
            --verbosity diagnostic

      - name: Verify
        shell: pwsh
        run: |
          if ($LASTEXITCODE -ne 0) {
            Write-Error "BUILD FAILED"
            exit 1
          }

          Write-Host "================================"
          Write-Host "BUILD SUCCESS"
          Write-Host "ERRORS = 0"
          Write-Host "================================"
