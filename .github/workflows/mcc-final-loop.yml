name: MPC Build

on:
  push:
    branches:
      - edit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MPC
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: Checkout edit
        uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Import Bannerlord DLLs from main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main --depth=1
          git checkout origin/main -- DLLs
          if (!(Test-Path "DLLs")) { throw "DLLs directory from main was not imported" }
          git restore --staged DLLs 2>$null
          Write-Host "Imported Bannerlord DLLs from main without staging them."

      - name: Patch MpcNetwork reconnect logic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'rebuild/MpcNetwork.cs'
          $text = Get-Content $path -Raw

          if ($text -notmatch 'private bool _connectionRunning;') { throw 'Network client anchor missing.' }

          if ($text -notmatch 'private int _connectionGeneration;') {
            $text = $text.Replace('private bool _connectionRunning;', "private bool _connectionRunning;`r`n`r`n        private int _connectionGeneration;")
          }

          $connectPattern = '(?s)        public void Connect\(\s*string ip\)\s*\{.*?        \}\s*\r?\n\r?\n        private async Task ConnectAsync\('
          $connectReplacement = @'
        public void Connect(
            string ip)
        {
            if (string.IsNullOrWhiteSpace(ip))
            {
                _vm?.SetStatus("CONNECTION FAILED: INVALID ADDRESS");
                return;
            }

            lock (_connectionLock)
            {
                _connectionGeneration++;
                int generation = _connectionGeneration;

                DisconnectInternal();

                HandshakeState.Reset();
                NetworkIdentityService.Reset();
                MultiplayerConnectionStatus.Set(
                    MultiplayerConnectionState.Connecting
                );

                try { WorldTransferService.Reset(); } catch { }
                try { MultiplayerWorldTransfer.Clear(); } catch { }

                _cts = new CancellationTokenSource();
                _connectionRunning = true;

                _ = ConnectAsync(
                    ip.Trim(),
                    _cts.Token,
                    generation
                );
            }
        }

        private async Task ConnectAsync(
'@
          $newText = [regex]::Replace($text, $connectPattern, $connectReplacement, 1)
          if ($newText -eq $text) { throw 'Connect method replacement failed.' }
          $text = $newText

          $sigPattern = 'private async Task ConnectAsync\(\s*string ip,\s*CancellationToken token\)'
          $sigReplacement = "private async Task ConnectAsync(`r`n            string ip,`r`n            CancellationToken token,`r`n            int generation)"
          $text = [regex]::Replace($text, $sigPattern, $sigReplacement, 1)

          $connectBodyPattern = '(?s)                await client\.ConnectAsync\(\s*ip,\s*25565\s*\);.*?                _tcpClient =\s*client;'
          $connectBodyReplacement = @'
                Task connectTask = client.ConnectAsync(ip, 25565);

                Task completed = await Task.WhenAny(
                    connectTask,
                    Task.Delay(TimeSpan.FromSeconds(10), token)
                );

                if (completed != connectTask)
                {
                    client.Close();
                    token.ThrowIfCancellationRequested();
                    throw new TimeoutException(
                        "Connection attempt timed out after 10 seconds."
                    );
                }

                await connectTask;

                if (
                    token.IsCancellationRequested ||
                    generation != _connectionGeneration)
                {
                    client.Close();
                    return;
                }

                _tcpClient = client;
'@
          $newText = [regex]::Replace($text, $connectBodyPattern, $connectBodyReplacement, 1)
          if ($newText -eq $text) { throw 'ConnectAsync body replacement failed.' }
          $text = $newText

          $finallyPattern = '(?s)            finally\s*\{\s*IsConnected =\s*false;\s*lock \(_connectionLock\)\s*\{\s*_connectionRunning =\s*false;\s*\}\s*\}'
          $finallyReplacement = @'
            finally
            {
                lock (_connectionLock)
                {
                    if (generation == _connectionGeneration)
                    {
                        IsConnected = false;
                        _connectionRunning = false;
                    }
                }
            }
'@
          $newText = [regex]::Replace($text, $finallyPattern, $finallyReplacement, 1)
          if ($newText -eq $text) { throw 'ConnectAsync finally replacement failed.' }
          $text = $newText

          $disconnectPattern = 'private void DisconnectInternal\(\)\s*\{'
          $text = [regex]::Replace($text, $disconnectPattern, "private void DisconnectInternal()`r`n        {`r`n            _connectionGeneration++;", 1)

          Set-Content $path -Value $text -Encoding UTF8
          Write-Host 'NETWORK_RECONNECT_PATCH=TRUE'

      - name: Thematic modular split
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project tools/RoslynSplitter/RoslynSplitter.csproj -- rebuild rebuild
          if (!(Test-Path "rebuild/REFACTOR_MAP.txt")) { throw "Thematic splitter did not produce REFACTOR_MAP.txt" }

      - name: Normalize generated using directives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem rebuild -Filter *.cs -File | ForEach-Object {
            $seen = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
            $output = New-Object System.Collections.Generic.List[string]
            foreach ($line in [System.IO.File]::ReadAllLines($_.FullName)) {
              if ($line -match '^\s*using\s+[^;]+;\s*$') {
                $key = $line.Trim()
                if (!$seen.Add($key)) { continue }
              }
              [void]$output.Add($line)
            }
            [System.IO.File]::WriteAllLines($_.FullName, $output, (New-Object System.Text.UTF8Encoding($false)))
          }
          Write-Host "Normalized duplicate using directives."

      - name: Verify source layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem rebuild -Filter *.cs -File)
          Write-Host "Root C# files: $($files.Count)"
          $files | ForEach-Object { Write-Host $_.Name }
          $main = $files | Where-Object { $_.Name -eq 'MultiplayerCampaignSubModule.cs' }
          if ($null -eq $main) { throw "Main submodule source is missing." }
          if ($files.Count -ne 10) { throw "Expected exactly 10 thematic C# files, got $($files.Count)." }
          if (Test-Path "rebuild/MpcConnectionRecoveryFix.cs") { throw "Old standalone recovery file was not merged." }
          $map = Get-Content "rebuild/REFACTOR_MAP.txt" -Raw
          if ($map -notmatch 'DECLARATIONS=\d+') { throw "REFACTOR_MAP declaration count missing." }
          if ($map -notmatch 'EMITTED=\d+') { throw "REFACTOR_MAP emitted count missing." }
          if ($map -notmatch 'FILES=10') { throw "Thematic layout is not exactly 10 files." }
          if ($map -notmatch 'MultiplayerCampaignBehavior -> MpcCampaign\.cs') { throw "Campaign behavior is not in MpcCampaign.cs." }
          if ($map -notmatch 'MultiplayerCampaignVM -> MpcUI\.cs') { throw "Campaign UI VM is not in MpcUI.cs." }
          if ($map -notmatch 'MultiplayerNetworkClient -> MpcNetwork\.cs') { throw "Network client is not in MpcNetwork.cs." }
          if ($map -notmatch 'MultiplayerCampaignHost -> MpcNetwork\.cs') { throw "Campaign host network service is not in MpcNetwork.cs." }
          if ($map -notmatch 'RemotePlayerManager -> MpcPlayers\.cs') { throw "RemotePlayerManager is not in MpcPlayers.cs." }
          if ($map -notmatch 'MpcRecoveryRuntime -> MpcSaveRecovery\.cs') { throw "Recovery runtime is not in MpcSaveRecovery.cs." }
          if ($map -notmatch 'MpcSaveTransferPatch -> MpcSaveRecovery\.cs') { throw "Save transfer patch is not in MpcSaveRecovery.cs." }

      - name: Restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore rebuild/MultiplayerCampaignRebuild.csproj --verbosity normal

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "===== MPC BUILD START ====="
          dotnet --info 2>&1 | Tee-Object -FilePath dotnet-info.log
          dotnet build rebuild/MultiplayerCampaignRebuild.csproj --configuration Release --no-restore --verbosity normal 2>&1 |
            Tee-Object -FilePath build.log
          $exitCode = $LASTEXITCODE
          Write-Host "BUILD_EXIT_CODE=$exitCode"
          Write-Host "===== MPC BUILD END ====="
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Print build summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "===== MPC BUILD SUMMARY ====="
          if (Test-Path build.log) {
            Write-Host "--- Errors ---"
            Select-String -Path build.log -Pattern '(?i)error [A-Z0-9]+|: error |error\s*CS[0-9]+|Build FAILED' |
              Select-Object -Last 120 | ForEach-Object { Write-Host $_.Line }
            Write-Host "--- Warnings ---"
            Select-String -Path build.log -Pattern '(?i)warning [A-Z0-9]+|: warning |warning\s*CS[0-9]+' |
              Select-Object -Last 120 | ForEach-Object { Write-Host $_.Line }
            Write-Host "--- Tail ---"
            Get-Content build.log -Tail 180
          }
          Write-Host "============================="

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpc-build-diagnostics-${{ github.run_id }}
          path: |
            build.log
            dotnet-info.log
            rebuild/REFACTOR_MAP.txt
            rebuild/BUILD_FAILURE.txt
          if-no-files-found: warn

      - name: Record build failure
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $summary = New-Object System.Text.StringBuilder
          [void]$summary.AppendLine("MPC BUILD FAILURE")
          [void]$summary.AppendLine("COMMIT=${{ github.sha }}")
          [void]$summary.AppendLine("RUN=${{ github.run_id }}")
          if (Test-Path build.log) {
            [void]$summary.AppendLine()
            [void]$summary.AppendLine("ERRORS:")
            Get-Content build.log |
              Select-String -Pattern '(?i): error |error\s*CS[0-9]+|Build FAILED' |
              Select-Object -Last 120 |
              ForEach-Object { [void]$summary.AppendLine($_.Line) }
            [void]$summary.AppendLine()
            [void]$summary.AppendLine("TAIL:")
            Get-Content build.log -Tail 100 |
              ForEach-Object { [void]$summary.AppendLine($_) }
          }
          Set-Content -Path rebuild/BUILD_FAILURE.txt -Value $summary.ToString() -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --cached --ignore-unmatch DLLs 2>$null
          git add rebuild/BUILD_FAILURE.txt
          git commit -m "ci: record MPC build failure [skip ci]"
          git push origin HEAD:edit

      - name: Commit modular source after successful build
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path "rebuild/BUILD_FAILURE.txt") { Remove-Item "rebuild/BUILD_FAILURE.txt" -Force }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --cached --ignore-unmatch DLLs 2>$null
          git add rebuild/MpcNetwork.cs
          if (git diff --cached --quiet) {
            Write-Host "No network source changes to commit."
            exit 0
          }
          git commit -m "fix: make MPC client reconnectable with timeout [skip ci]"
          git push origin HEAD:edit

      - name: Verify success
        if: success()
        shell: pwsh
        run: |
          Write-Host "================================"
          Write-Host "BUILD SUCCESS"
          Write-Host "NETWORK PATCH READY"
          Write-Host "ERRORS = 0"
          Write-Host "================================"
