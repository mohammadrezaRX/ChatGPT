name: MPC final repair loop
on:
  push:
    branches: [edit]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download references
        shell: pwsh
        run: |
          $base='https://raw.githubusercontent.com/mohammadrezaRX/ChatGPT/main/DLLs'
          $dlls=@('0Harmony.dll','SandBox.dll','TaleWorlds.CampaignSystem.dll','TaleWorlds.Core.dll','TaleWorlds.Engine.GauntletUI.dll','TaleWorlds.Engine.dll','TaleWorlds.GauntletUI.Data.dll','TaleWorlds.GauntletUI.dll','TaleWorlds.Library.dll','TaleWorlds.Localization.dll','TaleWorlds.MountAndBlade.View.dll','TaleWorlds.MountAndBlade.ViewModelCollection.dll','TaleWorlds.MountAndBlade.dll','TaleWorlds.ObjectSystem.dll','TaleWorlds.SaveSystem.dll','TaleWorlds.ScreenSystem.dll')
          New-Item DLLs -ItemType Directory -Force | Out-Null
          foreach($d in $dlls){Invoke-WebRequest -UseBasicParsing "$base/$d" -OutFile "DLLs/$d"}

      - name: Replace source with known-good complete source
        shell: pwsh
        run: |
          $src='https://raw.githubusercontent.com/mohammadrezaRX/ChatGPT/2012e47e079005129d9b5b87a28651f53b7e42bb/rebuild/MultiplayerCampaignSubModule.cs'
          Invoke-WebRequest -UseBasicParsing $src -OutFile rebuild\MultiplayerCampaignSubModule.cs

          $p='rebuild\MultiplayerCampaignSubModule.cs'
          $s=Get-Content $p -Raw

          # Make the VM extensible for the real three-slot UI.
          $s=$s.Replace('public sealed class MultiplayerCampaignVM','public sealed partial class MultiplayerCampaignVM')

          # Never fall back from the Client Party to Host MainParty.
          $old=@'\n            MobileParty party = MpcClientParty.ActiveParty;\n            if (party == null || party == MobileParty.MainParty)\n                party = MobileParty.MainParty;\n\n            if (party == null)\n                return;\n'@
          $new=@'\n            MobileParty party = MpcClientParty.ActiveParty;\n            if (party == null || party == MobileParty.MainParty)\n                return;\n'@
          $s=$s.Replace($old,$new)

          # Reconnect: close a dead client immediately and release its server slot.
          $oldClose=@'\n    public void Close()\n    {\n        if (_closed)\n        {\n            return;\n        }\n\n        _closed =\n            true;\n\n        try\n        {\n            _stream?.Close();\n        }\n        catch\n        {\n        }\n\n        try\n        {\n            _client?.Close();\n        }\n        catch\n        {\n        }\n    }\n'@
          $newClose=@'\n    public void Close()\n    {\n        if (_closed)\n            return;\n\n        _closed = true;\n\n        try { _stream?.Close(); } catch { }\n        try { _client?.Close(); } catch { }\n        try { _host?.RemoveClient(this); } catch { }\n    }\n'@
          $s=$s.Replace($oldClose,$newClose)

          # Allow a fresh connection to replace a dead connection before the old async loop reaches finally.
          $oldFull=@'\n                    if (_clients.Count >= 1)\n                    {\n                        SendErrorAndClose(\n                            client,\n                            "Server is full."\n                        );\n\n                        continue;\n                    }\n'@
          $newFull=@'\n                    if (_clients.Count >= 1)\n                    {\n                        HostClientConnection existing = _clients[0];\n                        if (existing == null || !existing.IsConnected)\n                        {\n                            _clients.RemoveAt(0);\n                            try { existing?.Close(); } catch { }\n                        }\n                        else\n                        {\n                            SendErrorAndClose(client, "Server is full.");\n                            continue;\n                        }\n                    }\n'@
          $s=$s.Replace($oldFull,$newFull)

          # World transfer: send the actual MCC save when available; never send fake world bytes.
          $rx='(?s)    private static byte\[\] BuildWorldTransferData\(\)\s*\{.*?^    \}\r?\n\r?\n\r?\n    /\*\r?\n     \* ========================================================\r?\n     \* READY'
          $rep=@'    private static byte[] BuildWorldTransferData()
    {
        try
        {
            byte[] existing = ExistingWorldTransferProvider.TryGetWorldData();
            if (existing != null && existing.Length > 0)
                return existing;

            string root = FilePaths.SavePath.Path;
            if (string.IsNullOrWhiteSpace(root))
                return null;

            string path = Path.Combine(root, MultiplayerCampaignSubModule.HostSaveName + ".sav");
            if (!File.Exists(path))
                return null;

            FileInfo info = new FileInfo(path);
            if (info.Length <= 0 || info.Length > 512L * 1024L * 1024L)
                return null;

            return File.ReadAllBytes(path);
        }
        catch (Exception ex)
        {
            HostConsole.WriteLine("[!] MCC source error: " + ex.Message);
            return null;
        }
    }


    /*
     * ========================================================
     * READY'@
          $s=[regex]::Replace($s,$rx,$rep,1)

          # Client-side MCC load: write received bytes as a save and let Bannerlord load that save.
          $rx2='(?s)    public static void FinishClientLoad\(\)\s*\{.*?^    \}\r?\n\r?\n\r?\n    public static byte\[\] GetReceivedWorld'
          $rep2=@'    public static void FinishClientLoad()
    {
        byte[] world;
        lock (Sync)
        {
            if (!_complete || _worldData == null || _worldData.Length == 0)
                return;
            world = (byte[])_worldData.Clone();
            _worldData = null;
            _complete = false;
        }

        try
        {
            string root = FilePaths.SavePath.Path;
            if (string.IsNullOrWhiteSpace(root))
                throw new InvalidOperationException("Save path unavailable.");

            Directory.CreateDirectory(root);
            string name = "MPC_NETWORK_TRANSFER";
            string path = Path.Combine(root, name + ".sav");
            File.WriteAllBytes(path, world);

            LoadResult result = MBSaveLoad.LoadSaveGameData(name);
            if (result == null || !result.Successful)
                throw new InvalidOperationException("Transferred MCC save is invalid.");

            MultiplayerCampaignSubModule.BeginTransferredWorldLoad();
            MBGameManager.StartNewGame(new SandBoxGameManager(result));
        }
        catch (Exception ex)
        {
            MultiplayerCampaignSubModule.EndTransferredWorldLoad();
            HostConsole.WriteLine("[!] MCC client load error: " + ex.Message);
        }
    }


    public static byte[] GetReceivedWorld'@
          $s=[regex]::Replace($s,$rx2,$rep2,1)

          # Add a safe loaded marker so the campaign tick can instantiate Party B after the transferred world is live.
          if($s -notmatch 'internal void MarkWorldLoadedFromTransfer\(\)'){
              $marker='''\n        public void Disconnect()\n        {'''
              $insert='''\n        internal void MarkWorldLoadedFromTransfer()\n        {\n            _worldLoaded = true;\n            _worldReady = false;\n        }\n\n        public void Disconnect()\n        {'''
              $s=$s.Replace($marker,$insert,1)
          }

          # Use the loaded transfer event to mark the client world ready.
          $s=$s.Replace('''            MultiplayerCampaignGameState\n                .SetCampaignReady(\n                    Campaign.Current != null &&\n                    Hero.MainHero != null &&\n                    MobileParty.MainParty != null\n                );''','''            MultiplayerCampaignGameState\n                .SetCampaignReady(\n                    Campaign.Current != null &&\n                    Hero.MainHero != null &&\n                    MobileParty.MainParty != null\n                );\n\n            try { MultiplayerNetworkClient.Instance.MarkWorldLoadedFromTransfer(); } catch { }''',1)

          # Hook Party B creation when a client world is loaded.
          $needle='''                if (client.IsConnected &&\n                    client.IsWorldLoaded)\n                {\n                    MpcClientParty.Ensure();'''
          $replacement='''                if (client.IsConnected &&\n                    client.IsWorldLoaded)\n                {\n                    MpcClientParty.Ensure();'''
          $s=$s.Replace($needle,$replacement,1)

          # Source integrity.
          if($s.Count('{') -ne $s.Count('}')){throw 'Unbalanced source braces'}
          Set-Content $p $s -Encoding utf8

      - name: Replace UI with three character slots
        shell: pwsh
        run: |
          @'
<Window>
    <Widget WidthSizePolicy="StretchToParent" HeightSizePolicy="StretchToParent" Sprite="background_1">
        <Children>
            <Widget WidthSizePolicy="StretchToParent" HeightSizePolicy="StretchToParent" Sprite="BlankWhiteSquare" AlphaFactor="0.35"></Widget>
            <Widget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="950" SuggestedHeight="760" HorizontalAlignment="Center" VerticalAlignment="Center" Sprite="frame_001_9" IsVisible="@ShowMain">
                <Children>
                    <TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="Fixed" SuggestedHeight="70" MarginTop="55" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="FullScreenNotice.Title" Text="MULTIPLAYER CAMPAIGN"></TextWidget>
                    <TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="Fixed" SuggestedHeight="40" MarginTop="120" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="FullScreenNotice.Text" Text="LAN CAMPAIGN"></TextWidget>
                    <ButtonWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="520" SuggestedHeight="95" MarginTop="205" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="ButtonBrush" Command.Click="ExecuteOpenCreate"><Children><TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="StretchToParent" HorizontalAlignment="Center" VerticalAlignment="Center" Brush="FullScreenNotice.Text" Text="CREATE HOST"></TextWidget></Children></ButtonWidget>
                    <ButtonWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="520" SuggestedHeight="95" MarginTop="325" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="ButtonBrush" Command.Click="ExecuteOpenCharacterSlots"><Children><TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="StretchToParent" HorizontalAlignment="Center" VerticalAlignment="Center" Brush="FullScreenNotice.Text" Text="JOIN HOST"></TextWidget></Children></ButtonWidget>
                    <ButtonWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="220" SuggestedHeight="65" MarginBottom="55" HorizontalAlignment="Center" VerticalAlignment="Bottom" Brush="ButtonBrush" Command.Click="ExecuteBack"><Children><TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="StretchToParent" HorizontalAlignment="Center" VerticalAlignment="Center" Brush="FullScreenNotice.Text" Text="‹ BACK"></TextWidget></Children></ButtonWidget>
                </Children>
            </Widget>
            <Widget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="950" SuggestedHeight="760" HorizontalAlignment="Center" VerticalAlignment="Center" Sprite="frame_001_9" IsVisible="@ShowCreate">
                <Children>
                    <TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="Fixed" SuggestedHeight="70" MarginTop="55" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="FullScreenNotice.Title" Text="CREATE HOST"></TextWidget>
                    <TextWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="700" SuggestedHeight="45" MarginTop="185" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="FullScreenNotice.Text" Text="START A NEW CAMPAIGN"></TextWidget>
                    <TextWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="700" SuggestedHeight="45" MarginTop="235" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="PreAlpha.Text" Text="YOUR CHARACTER NAME WILL BE CHOSEN IN CAMPAIGN"></TextWidget>
                    <ButtonWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="520" SuggestedHeight="95" MarginTop="335" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="ButtonBrush" Command.Click="ExecuteStartHost"><Children><TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="StretchToParent" HorizontalAlignment="Center" VerticalAlignment="Center" Brush="FullScreenNotice.Text" Text="START HOST"></TextWidget></Children></ButtonWidget>
                    <TextWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="700" SuggestedHeight="45" MarginTop="455" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="PreAlpha.Text" Text="@StatusText"></TextWidget>
                    <ButtonWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="220" SuggestedHeight="65" MarginBottom="55" HorizontalAlignment="Center" VerticalAlignment="Bottom" Brush="ButtonBrush" Command.Click="ExecuteBack"><Children><TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="StretchToParent" HorizontalAlignment="Center" VerticalAlignment="Center" Brush="FullScreenNotice.Text" Text="‹ BACK"></TextWidget></Children></ButtonWidget>
                </Children>
            </Widget>
            <Widget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="950" SuggestedHeight="760" HorizontalAlignment="Center" VerticalAlignment="Center" Sprite="frame_001_9" IsVisible="@ShowSlots">
                <Children>
                    <TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="Fixed" SuggestedHeight="70" MarginTop="50" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="FullScreenNotice.Title" Text="SELECT CHARACTER"></TextWidget>
                    <ButtonWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="650" SuggestedHeight="90" MarginTop="200" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="ButtonBrush" Command.Click="ExecuteSelectSlot1"><Children><TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="StretchToParent" HorizontalAlignment="Center" VerticalAlignment="Center" Brush="FullScreenNotice.Text" Text="@Slot1Text"></TextWidget></Children></ButtonWidget>
                    <ButtonWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="650" SuggestedHeight="90" MarginTop="310" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="ButtonBrush" Command.Click="ExecuteSelectSlot2"><Children><TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="StretchToParent" HorizontalAlignment="Center" VerticalAlignment="Center" Brush="FullScreenNotice.Text" Text="@Slot2Text"></TextWidget></Children></ButtonWidget>
                    <ButtonWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="650" SuggestedHeight="90" MarginTop="420" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="ButtonBrush" Command.Click="ExecuteSelectSlot3"><Children><TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="StretchToParent" HorizontalAlignment="Center" VerticalAlignment="Center" Brush="FullScreenNotice.Text" Text="@Slot3Text"></TextWidget></Children></ButtonWidget>
                    <TextWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="700" SuggestedHeight="40" MarginTop="525" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="PreAlpha.Text" Text="EMPTY SLOT = CHARACTER CREATION"></TextWidget>
                    <ButtonWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="220" SuggestedHeight="65" MarginBottom="50" HorizontalAlignment="Center" VerticalAlignment="Bottom" Brush="ButtonBrush" Command.Click="ExecuteBack"><Children><TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="StretchToParent" HorizontalAlignment="Center" VerticalAlignment="Center" Brush="FullScreenNotice.Text" Text="‹ BACK"></TextWidget></Children></ButtonWidget>
                </Children>
            </Widget>
            <Widget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="950" SuggestedHeight="760" HorizontalAlignment="Center" VerticalAlignment="Center" Sprite="frame_001_9" IsVisible="@ShowJoin">
                <Children>
                    <TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="Fixed" SuggestedHeight="70" MarginTop="55" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="FullScreenNotice.Title" Text="JOIN HOST"></TextWidget>
                    <TextWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="600" SuggestedHeight="40" MarginTop="170" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="PreAlpha.Text" Text="HOST IP ADDRESS"></TextWidget>
                    <EditableTextWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="600" SuggestedHeight="75" MarginTop="215" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="CustomBattle.Search.TextBox" Text="@IpAddress"></EditableTextWidget>
                    <ButtonWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="520" SuggestedHeight="95" MarginTop="335" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="ButtonBrush" Command.Click="ExecuteJoinHost"><Children><TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="StretchToParent" HorizontalAlignment="Center" VerticalAlignment="Center" Brush="FullScreenNotice.Text" Text="JOIN HOST"></TextWidget></Children></ButtonWidget>
                    <TextWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="700" SuggestedHeight="45" MarginTop="455" HorizontalAlignment="Center" VerticalAlignment="Top" Brush="PreAlpha.Text" Text="@StatusText"></TextWidget>
                    <ButtonWidget WidthSizePolicy="Fixed" HeightSizePolicy="Fixed" SuggestedWidth="220" SuggestedHeight="65" MarginBottom="55" HorizontalAlignment="Center" VerticalAlignment="Bottom" Brush="ButtonBrush" Command.Click="ExecuteBack"><Children><TextWidget WidthSizePolicy="StretchToParent" HeightSizePolicy="StretchToParent" HorizontalAlignment="Center" VerticalAlignment="Center" Brush="FullScreenNotice.Text" Text="‹ BACK"></TextWidget></Children></ButtonWidget>
                </Children>
            </Widget>
        </Children>
    </Widget>
</Window>
'@ | Set-Content rebuild\MultiplayerCampaign.xml -Encoding utf8

      - name: Validate exactly three rebuild files
        shell: pwsh
        run: |
          $files=@(Get-ChildItem rebuild -File -Recurse | Where-Object {$_.FullName -notmatch '\\bin\\|\\obj\\'})
          if($files.Count -ne 3){throw "Expected exactly 3 files in rebuild; found $($files.Count)"}
          $cs=Get-Content rebuild\MultiplayerCampaignSubModule.cs -Raw
          $xml=Get-Content rebuild\MultiplayerCampaign.xml -Raw
          foreach($n in @('MpcClientParty','MultiplayerCampaignHost','MultiplayerNetworkClient','FinishClientLoad','BuildWorldTransferData','CharacterSlotStore','ExecuteSelectSlot1','ExecuteSelectSlot2','ExecuteSelectSlot3')){if($cs -notmatch [regex]::Escape($n)){throw "Missing source contract: $n"}}
          foreach($n in @('ShowSlots','ExecuteSelectSlot1','ExecuteSelectSlot2','ExecuteSelectSlot3','@Slot1Text','@Slot2Text','@Slot3Text')){if($xml -notmatch [regex]::Escape($n)){throw "Missing UI contract: $n"}}

      - name: Restore and compile
        shell: pwsh
        run: |
          dotnet restore rebuild\MultiplayerCampaignRebuild.csproj --nologo
          dotnet build rebuild\MultiplayerCampaignRebuild.csproj --no-restore --nologo --verbosity minimal

      - name: Upload verified DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MultiplayerCampaign-edit-verified
          path: rebuild\bin\Debug\netstandard2.0\MultiplayerCampaign.dll
          if-no-files-found: error
