name: MPC Deduplicate Build

on:
  push:
    branches: [edit]

permissions:
  contents: write

jobs:
  dedupe-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run deduplication
        run: python3 .github/scripts/dedupe_mpc.py

      - name: Build MPC
        run: dotnet build rebuild/MultiplayerCampaignRebuild.csproj --configuration Release --no-restore

      - name: Commit corrected source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rebuild/MultiplayerCampaignSubModule.cs
          if git diff --cached --quiet; then
            echo 'No source changes after deduplication.'
          else
            git commit -m 'refactor: remove duplicated MPC layers'
            git push origin HEAD:edit
          fi
