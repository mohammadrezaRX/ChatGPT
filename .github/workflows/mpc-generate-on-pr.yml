name: Generate MPC rebuild source on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'multiplayer-campaign-work' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: multiplayer-campaign-work

      - name: Generate source from existing layer
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/mpc-rebuild.yml').read_text(encoding='utf-8')
          marker_a = "layer = r'''"
          marker_b = "'''\n              rebuilt = original + layer"
          a = workflow.find(marker_a)
          b = workflow.find(marker_b, a + len(marker_a))
          if a < 0 or b < 0:
              raise SystemExit('Layer markers not found')
          layer = workflow[a + len(marker_a):b]
          original = Path('MultiplayerCampaignSubModule.cs').read_text(encoding='utf-8-sig')
          target = Path('rebuild/MultiplayerCampaignSubModule.cs')
          target.parent.mkdir(parents=True, exist_ok=True)
          marker = '// ===== MPC REBUILD LAYER 2026 ====='
          if marker not in original:
              original = original + layer
          target.write_text(original, encoding='utf-8')

      - name: Commit rebuild source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebuild/MultiplayerCampaignSubModule.cs
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Generate full Multiplayer Campaign rebuild source"
          git push origin multiplayer-campaign-work
