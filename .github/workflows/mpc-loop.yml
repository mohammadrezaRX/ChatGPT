name: MPC loop

on:
  push:
    branches: [edit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  loop:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout edit HEAD
        uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download Bannerlord references
        shell: pwsh
        run: |
          $base='https://raw.githubusercontent.com/mohammadrezaRX/ChatGPT/main/DLLs'
          $dlls=@('0Harmony.dll','SandBox.dll','TaleWorlds.CampaignSystem.dll','TaleWorlds.Core.dll','TaleWorlds.Engine.GauntletUI.dll','TaleWorlds.Engine.dll','TaleWorlds.GauntletUI.Data.dll','TaleWorlds.GauntletUI.dll','TaleWorlds.Library.dll','TaleWorlds.Localization.dll','TaleWorlds.MountAndBlade.View.dll','TaleWorlds.MountAndBlade.ViewModelCollection.dll','TaleWorlds.MountAndBlade.dll','TaleWorlds.ObjectSystem.dll','TaleWorlds.SaveSystem.dll','TaleWorlds.ScreenSystem.dll')
          New-Item DLLs -ItemType Directory -Force | Out-Null
          foreach($dll in $dlls){ Invoke-WebRequest -UseBasicParsing "$base/$dll" -OutFile "DLLs/$dll" }

      - name: Replace source with the next complete revision
        shell: pwsh
        run: |
          $p='rebuild\MultiplayerCampaignSubModule.cs'
          $s=Get-Content $p -Raw

          $s=$s.Replace('public sealed class MultiplayerCampaignVM', 'public sealed partial class MultiplayerCampaignVM')

          $s=$s.Replace(@'
        public void ExecuteOpenJoin()
        {
            ShowMain = false;
            ShowCreate = false;
            ShowJoin = true;

            StatusText = "";
        }
'@,@'
        public void ExecuteOpenJoin()
        {
            ShowMain = false;
            ShowCreate = false;
            ShowJoin = false;
            ShowSlots = true;
            StatusText = "";
            RefreshSlotLabels();
        }
'@)

          $s=$s.Replace(@'
        public void ExecuteBackToMain()
        {
            ShowMain = true;
            ShowCreate = false;
            ShowJoin = false;

            StatusText = "";
        }
'@,@'
        public void ExecuteBackToMain()
        {
            ShowMain = true;
            ShowCreate = false;
            ShowJoin = false;
            ShowSlots = false;

            StatusText = "";
        }
'@)

          $s=$s.Replace(@'
        private void SendHello()
'@,@'
        private void SendHello()
'@)

          $s=$s.Replace(@'
                case NetworkPacketType.WorldComplete:
                    _worldReady = true;

                    MultiplayerWorldTransfer
                        .HandleWorldComplete(
                            message.Payload
                        );
                    break;
'@,@'
                case NetworkPacketType.WorldComplete:
                    MultiplayerWorldTransfer
                        .HandleWorldComplete(
                            message.Payload
                        );
                    _worldReady =
                        MultiplayerWorldTransfer.IsComplete;
                    break;
'@)

          $s=$s.Replace(@'
            if (_connectionRunning)
            {
                return;
            }

            DisconnectInternal();
'@,@'
            if (_connectionRunning && IsConnected)
            {
                return;
            }

            DisconnectInternal();
'@)

          $s=$s.Replace(@'
            _connectionRunning =
                false;

            while (
                _incoming.TryDequeue(
                    out _))
'@,@'
            _connectionRunning =
                false;

            try { MultiplayerWorldTransfer.Clear(); } catch { }
            try { RemotePlayerManager.Clear(); } catch { }
            try { MpcClientParty.Clear(); } catch { }

            while (
                _incoming.TryDequeue(
                    out _))
'@)

          $s=$s.Replace(@'
            CampaignMessageFeed.Show(
                "[*] Campaign world received."
            );
'@,@'
            CampaignMessageFeed.Show(
                "[*] Campaign world received."
            );
'@)

          $worldPattern='(?s)    private static byte\[\] BuildWorldTransferData\(\)\s*\{.*?^\s*    /\*\r?\n     \* ========================================================\r?\n     \* READY'
          $worldReplacement=@'
    private static byte[] BuildWorldTransferData()
    {
        try
        {
            string saveDirectory = FilePaths.SavePath.Path;
            if (string.IsNullOrWhiteSpace(saveDirectory))
                return null;

            string file = Path.Combine(saveDirectory, "MCC.sav");
            if (!File.Exists(file))
                return null;

            FileInfo info = new FileInfo(file);
            if (info.Length <= 0 || info.Length > 512L * 1024L * 1024L)
                return null;

            return File.ReadAllBytes(file);
        }
        catch (Exception ex)
        {
            HostConsole.WriteLine("[!] MCC source read error: " + ex.Message);
            return null;
        }
    }


    /*
     * ========================================================
     * READY
'@
          $s=[regex]::Replace($s,$worldPattern,$worldReplacement,1)

          $finishPattern='(?s)    public static void FinishClientLoad\(\)\s*\{.*?^    \}\r?\n\r?\n\r?\n    public static byte\[\] GetReceivedWorld'
          $finishReplacement=@'
    public static void FinishClientLoad()
    {
        byte[] world;

        lock (Sync)
        {
            if (!_complete || _worldData == null || _worldData.Length == 0)
                return;

            world = (byte[])_worldData.Clone();
            _worldData = null;
            _complete = false;
        }

        try
        {
            string saveDirectory = FilePaths.SavePath.Path;
            if (string.IsNullOrWhiteSpace(saveDirectory))
                throw new InvalidOperationException("Save directory unavailable.");

            Directory.CreateDirectory(saveDirectory);
            string transferName = "MPC_NETWORK_TRANSFER";
            string transferPath = Path.Combine(saveDirectory, transferName + ".sav");
            File.WriteAllBytes(transferPath, world);

            LoadResult result = MBSaveLoad.LoadSaveGameData(transferName);
            if (result == null || !result.Successful)
                throw new InvalidOperationException("Transferred MCC save could not be loaded.");

            MultiplayerCampaignSubModule.BeginTransferredWorldLoad();
            MBGameManager.StartNewGame(new SandBoxGameManager(result));
            HostConsole.WriteLine("[*] MCC transfer load started.");

            try
            {
                FieldInfo loadedField =
                    typeof(MultiplayerNetworkClient).GetField(
                        "_worldLoaded",
                        BindingFlags.Instance | BindingFlags.NonPublic
                    );
                if (loadedField != null)
                    loadedField.SetValue(MultiplayerNetworkClient.Instance, true);
            }
            catch
            {
            }
        }
        catch (Exception ex)
        {
            MultiplayerCampaignSubModule.EndTransferredWorldLoad();
            HostConsole.WriteLine("[!] MCC transfer load error: " + ex.Message);
        }
    }


    public static byte[] GetReceivedWorld
'@
          $s=[regex]::Replace($s,$finishPattern,$finishReplacement,1)

          $captureOld='PartySize = Math.Max(1, Math.Min(10000, CampaignWorld.GetMainPartySize())),'
          $captureNew=@'
PartySize = Math.Max(
    1,
    Math.Min(
        10000,
        party.MemberRoster != null ? party.MemberRoster.TotalManCount : 1
    )
),'@
          $s=$s.Replace($captureOld,$captureNew)

          $sendOld=@'
            MobileParty party = MpcClientParty.ActiveParty;
            if (party == null || party == MobileParty.MainParty)
                party = MobileParty.MainParty;

            if (party == null)
                return;
'@
          $sendNew=@'
            MobileParty party = MpcClientParty.ActiveParty;
            if (party == null || party == MobileParty.MainParty)
                return;
'@
          $s=$s.Replace($sendOld,$sendNew)

          $partyCreateOld='''                    Party = Helpers.MobilePartyHelper.CreateNewClanMobileParty(Hero, Clan);
                    if (Party == MobileParty.MainParty)
                    {
                        Party = null;
                        return null;
                    }
'''
          $partyCreateNew='''                    Party = null;
                    try
                    {
                        foreach (MobileParty existing in Campaign.Current.MobileParties)
                        {
                            if (existing == null || existing == MobileParty.MainParty)
                                continue;
                            if (existing.LeaderHero == Hero)
                            {
                                Party = existing;
                                break;
                            }
                        }
                    }
                    catch
                    {
                    }

                    if (Party == null)
                        Party = Helpers.MobilePartyHelper.CreateNewClanMobileParty(Hero, Clan);

                    if (Party == null || Party == MobileParty.MainParty)
                    {
                        Party = null;
                        return null;
                    }
'''
          $s=$s.Replace($partyCreateOld,$partyCreateNew)

          $partial=@'

namespace MultiplayerCampaign
{
    public sealed partial class MultiplayerCampaignVM
    {
        private bool _showSlots;
        private string _slot1Text = "SLOT 1 - EMPTY";
        private string _slot2Text = "SLOT 2 - EMPTY";
        private string _slot3Text = "SLOT 3 - EMPTY";

        [DataSourceProperty]
        public bool ShowSlots
        {
            get { return _showSlots; }
            private set
            {
                if (_showSlots == value)
                    return;
                _showSlots = value;
                OnPropertyChangedWithValue(value, nameof(ShowSlots));
            }
        }

        [DataSourceProperty]
        public string Slot1Text { get { return _slot1Text; } }

        [DataSourceProperty]
        public string Slot2Text { get { return _slot2Text; } }

        [DataSourceProperty]
        public string Slot3Text { get { return _slot3Text; } }

        private void RefreshSlotLabels()
        {
            CharacterSlotStore.EnsureLoaded();
            _slot1Text = BuildSlotText(0);
            _slot2Text = BuildSlotText(1);
            _slot3Text = BuildSlotText(2);
            OnPropertyChanged(nameof(Slot1Text));
            OnPropertyChanged(nameof(Slot2Text));
            OnPropertyChanged(nameof(Slot3Text));
        }

        private static string BuildSlotText(int slot)
        {
            CharacterSlotData data = CharacterSlotStore.Get(slot);
            if (data == null || !data.IsValid)
                return "SLOT " + (slot + 1) + " - EMPTY / CREATE";
            return "SLOT " + (slot + 1) + " - " + (data.Name ?? "Player");
        }

        public void ExecuteSlot1() { SelectOrCreateSlot(0); }
        public void ExecuteSlot2() { SelectOrCreateSlot(1); }
        public void ExecuteSlot3() { SelectOrCreateSlot(2); }

        private void SelectOrCreateSlot(int slot)
        {
            CharacterSlotStore.EnsureLoaded();
            CharacterSlotData data = CharacterSlotStore.Get(slot);

            if (data == null || !data.IsValid)
            {
                string name = string.IsNullOrWhiteSpace(PlayerName)
                    ? "Player"
                    : PlayerName.Trim();
                string characterId = Guid.NewGuid().ToString("N");
                string characterCode = "";
                try
                {
                    characterCode = CharacterObject.PlayerCharacter != null
                        ? CharacterObject.PlayerCharacter.StringId
                        : "";
                }
                catch
                {
                }

                if (!CharacterSlotStore.Save(slot, characterId, name, characterCode))
                {
                    StatusText = "CHARACTER SLOT SAVE FAILED";
                    return;
                }

                data = CharacterSlotStore.Get(slot);
            }

            if (!MpcSession.SelectSlot(slot))
            {
                StatusText = "CHARACTER SLOT SELECT FAILED";
                return;
            }

            LocalPlayerState.SetDisplayName(MpcSession.Name);
            ShowSlots = false;
            ShowJoin = true;
            ShowCreate = false;
            ShowMain = false;
            StatusText = "SLOT " + (slot + 1) + " SELECTED";
        }
    }
}
'@
          $s += $partial

          p='rebuild\MultiplayerCampaignSubModule.cs'
          Set-Content $p $s -Encoding utf8

