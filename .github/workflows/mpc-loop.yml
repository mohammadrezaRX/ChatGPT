'@ | Set-Content $p -Encoding utf8

      - name: Validate source contracts
        shell: pwsh
        run: |
          $s=Get-Content 'rebuild\MultiplayerCampaignSubModule.cs' -Raw
          $xml=Get-Content 'rebuild\MultiplayerCampaign.xml' -Raw
          $required=@('FinishClientLoad','BuildWorldTransferData','MpcClientParty','SelectOrCreateIdentityFromCurrentPlayer','CharacterSlotStore','ExecuteSlot1','ExecuteSlot2','ExecuteSlot3','ShowSlots','WorldComplete')
          foreach($x in $required){ if($s -notmatch [regex]::Escape($x)){ throw "Missing source contract: $x" } }
          foreach($x in @('ExecuteSlot1','ExecuteSlot2','ExecuteSlot3','@ShowSlots','@Slot1Text','@Slot2Text','@Slot3Text')){ if($xml -notmatch [regex]::Escape($x)){ throw "Missing UI contract: $x" } }
          if($s -match 'party = MobileParty.MainParty;\s*\r?\n\s*if \(party == null\)\s*\r?\n\s*return;' ){ throw 'Client fallback to Host MainParty remains.' }

      - name: Verify exactly three rebuild files
        shell: pwsh
        run: |
          $files=@(Get-ChildItem rebuild -File -Recurse | Where-Object {$_.FullName -notmatch '\\bin\\|\\obj\\'})
          $allowed=@('rebuild\MultiplayerCampaignSubModule.cs','rebuild\MultiplayerCampaignRebuild.csproj','rebuild\MultiplayerCampaign.xml')
          if($files.Count -ne 3){throw "Expected 3 rebuild files; found $($files.Count)."}
          foreach($f in $files){$rel=$f.FullName.Substring((Get-Location).Path.Length+1);if($allowed -notcontains $rel){throw "Unexpected rebuild file: $rel"}}

      - name: Build
        shell: pwsh
        run: |
          dotnet restore rebuild\MultiplayerCampaignRebuild.csproj --nologo
          dotnet build rebuild\MultiplayerCampaignRebuild.csproj --no-restore --nologo --verbosity minimal

      - name: Upload DLL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MultiplayerCampaign-edit-dll
          path: rebuild\bin\Debug\netstandard2.0\MultiplayerCampaign.dll
          if-no-files-found: error

      - name: Replace remote source only after successful build
        if: success()
        shell: pwsh
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add rebuild\MultiplayerCampaignSubModule.cs rebuild\MultiplayerCampaign.xml
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'Implement MCC reconnect, world load, Party A/B and character slots'
          git fetch origin edit
          git rebase origin/edit
          git push origin HEAD:edit
