name: MPC Network One-Time Patch

on:
  push:
    branches:
      - edit

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 0

      - name: Patch active MultiplayerNetworkClient only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'rebuild/MpcNetwork.cs'
          $text = [System.IO.File]::ReadAllText($path)
          $text = $text.Replace("`r`n", "`n").Replace("`r", "`n")

          $namespaceMarker = 'namespace MultiplayerCampaign'
          $classMarker = 'public sealed class MultiplayerNetworkClient'
          $nextNamespaceMarker = 'namespace MultiplayerCampaignRebuildLayer'

          $ns = $text.IndexOf($namespaceMarker, [System.StringComparison]::Ordinal)
          if ($ns -lt 0) { throw 'MultiplayerCampaign namespace not found.' }
          $classStart = $text.IndexOf($classMarker, $ns, [System.StringComparison]::Ordinal)
          if ($classStart -lt 0) { throw 'Active MultiplayerNetworkClient not found.' }
          $nextNs = $text.IndexOf($nextNamespaceMarker, $classStart, [System.StringComparison]::Ordinal)
          if ($nextNs -lt 0) { $nextNs = $text.Length }

          $prefix = $text.Substring(0, $classStart)
          $segment = $text.Substring($classStart, $nextNs - $classStart)
          $suffix = $text.Substring($nextNs)

          if ($segment -notmatch 'private bool _connectionRunning;') { throw 'Connection running field not found.' }
          if ($segment -notmatch 'private int _connectionGeneration;') {
            $segment = $segment.Replace(
              '        private bool _connectionRunning;',
              "        private bool _connectionRunning;`n`n        private int _connectionGeneration;"
            )
          }

          $connectPattern = '(?s)        public void Connect\(\s*string ip\s*\)\s*\{.*?\n        \}\s*\n\s*private async Task ConnectAsync\('
          $connectReplacement = @'
        public void Connect(
            string ip)
        {
            if (string.IsNullOrWhiteSpace(ip))
            {
                _vm?.SetStatus("CONNECTION FAILED: INVALID ADDRESS");
                return;
            }

            lock (_connectionLock)
            {
                // Invalidate and cancel every previous attempt before starting a new one.
                DisconnectInternal();
                int generation = _connectionGeneration;

                HandshakeState.Reset();
                NetworkIdentityService.Reset();
                MultiplayerConnectionStatus.Set(
                    MultiplayerConnectionState.Connecting
                );

                try { WorldTransferService.Reset(); } catch { }
                try { MultiplayerWorldTransfer.Clear(); } catch { }

                _cts = new CancellationTokenSource();
                _connectionRunning = true;

                _ = ConnectAsync(
                    ip.Trim(),
                    _cts.Token,
                    generation
                );
            }
        }

        private async Task ConnectAsync(
'@
          $patched = [regex]::Replace($segment, $connectPattern, $connectReplacement, 1)
          if ($patched -eq $segment) { throw 'Connect method patch failed.' }
          $segment = $patched

          $sigPattern = '(?s)private async Task ConnectAsync\(\s*string ip,\s*CancellationToken token\)'
          $sigReplacement = @'
private async Task ConnectAsync(
            string ip,
            CancellationToken token,
            int generation)
'@
          $patched = [regex]::Replace($segment, $sigPattern, $sigReplacement, 1)
          if ($patched -eq $segment) { throw 'ConnectAsync signature patch failed.' }
          $segment = $patched

          $bodyPattern = '(?s)                await client\.ConnectAsync\(.*?                _tcpClient\s*=\s*client;'
          $bodyReplacement = @'
                Task connectTask = client.ConnectAsync(ip, 25565);

                Task completed = await Task.WhenAny(
                    connectTask,
                    Task.Delay(TimeSpan.FromSeconds(10), token)
                );

                if (completed != connectTask)
                {
                    client.Close();
                    token.ThrowIfCancellationRequested();
                    throw new TimeoutException(
                        "Connection attempt timed out after 10 seconds."
                    );
                }

                await connectTask;

                if (
                    token.IsCancellationRequested ||
                    generation != _connectionGeneration)
                {
                    client.Close();
                    return;
                }

                _tcpClient = client;
'@
          $patched = [regex]::Replace($segment, $bodyPattern, $bodyReplacement, 1)
          if ($patched -eq $segment) { throw 'ConnectAsync body patch failed.' }
          $segment = $patched

          $finallyPattern = '(?s)            finally\s*\{\s*IsConnected\s*=\s*false;\s*lock \(_connectionLock\)\s*\{\s*_connectionRunning\s*=\s*false;\s*\}\s*\}'
          $finallyReplacement = @'
            finally
            {
                lock (_connectionLock)
                {
                    if (generation == _connectionGeneration)
                    {
                        IsConnected = false;
                        _connectionRunning = false;
                    }
                }
            }
'@
          $patched = [regex]::Replace($segment, $finallyPattern, $finallyReplacement, 1)
          if ($patched -eq $segment) { throw 'ConnectAsync finally patch failed.' }
          $segment = $patched

          $disconnectPattern = '(?s)        private void DisconnectInternal\(\)\s*\{'
          $disconnectReplacement = "        private void DisconnectInternal()`n        {`n            _connectionGeneration++;"
          $patched = [regex]::Replace($segment, $disconnectPattern, $disconnectReplacement, 1)
          if ($patched -eq $segment) { throw 'DisconnectInternal patch failed.' }
          $segment = $patched

          $result = $prefix + $segment + $suffix
          [System.IO.File]::WriteAllText($path, $result, (New-Object System.Text.UTF8Encoding($false)))

          $verify = [System.IO.File]::ReadAllText($path)
          foreach ($needle in @('private int _connectionGeneration;', 'Task.WhenAny', 'Connection attempt timed out after 10 seconds.', 'int generation')) {
            if ($verify.IndexOf($needle, [System.StringComparison]::Ordinal) -lt 0) {
              throw "Verification failed: $needle"
            }
          }
          Write-Host 'NETWORK_RECONNECT_PATCH=TRUE'

      - name: Build patched network
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin main --depth=1
          git checkout origin/main -- DLLs
          dotnet restore rebuild/MultiplayerCampaignRebuild.csproj
          dotnet build rebuild/MultiplayerCampaignRebuild.csproj --configuration Release --no-restore --verbosity normal

      - name: Commit patched network only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --cached --ignore-unmatch DLLs 2>$null
          git add rebuild/MpcNetwork.cs
          if (git diff --cached --quiet) { throw 'No MpcNetwork.cs change detected.' }
          git commit -m "fix: make MPC client reconnectable with timeout [skip ci]"
          git push origin HEAD:edit
