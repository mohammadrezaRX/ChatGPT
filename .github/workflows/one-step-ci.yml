name: MPC one-step CI

on:
  push:
    branches: [edit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edit
          fetch-depth: 1

      - name: Download Bannerlord DLL references
        shell: pwsh
        run: |
          $base = 'https://raw.githubusercontent.com/mohammadrezaRX/ChatGPT/main/DLLs'
          $dlls = @(
            '0Harmony.dll','SandBox.dll','TaleWorlds.CampaignSystem.dll','TaleWorlds.Core.dll',
            'TaleWorlds.Engine.GauntletUI.dll','TaleWorlds.Engine.dll','TaleWorlds.GauntletUI.Data.dll',
            'TaleWorlds.GauntletUI.dll','TaleWorlds.Library.dll','TaleWorlds.Localization.dll',
            'TaleWorlds.MountAndBlade.View.dll','TaleWorlds.MountAndBlade.ViewModelCollection.dll',
            'TaleWorlds.MountAndBlade.dll','TaleWorlds.ObjectSystem.dll','TaleWorlds.SaveSystem.dll',
            'TaleWorlds.ScreenSystem.dll'
          )
          New-Item -ItemType Directory -Path DLLs -Force | Out-Null
          foreach ($dll in $dlls) {
            Invoke-WebRequest -UseBasicParsing -Uri "$base/$dll" -OutFile "DLLs/$dll"
          }

      - name: Patch compile blockers
        shell: pwsh
        run: |
          $p = 'rebuild\MultiplayerCampaignSubModule.cs'
          $s = Get-Content $p -Raw
          $s = $s.Replace('private const string HostSaveName =', 'internal const string HostSaveName =')
          $s = [regex]::Replace($s, '(?m)^\s*try \{ Party\.SetAsMainParty\(\); \} catch \{ \}\r?\n', '')
          Set-Content $p $s -Encoding utf8

      - name: Assert exactly three rebuild files
        shell: pwsh
        run: |
          $files = @(Get-ChildItem rebuild -File -Recurse | Where-Object { $_.FullName -notmatch '\\bin\\|\\obj\\' })
          $allowed = @(
            'rebuild\MultiplayerCampaignSubModule.cs',
            'rebuild\MultiplayerCampaignRebuild.csproj',
            'rebuild\MultiplayerCampaign.xml'
          )
          foreach ($f in $files) {
            $rel = $f.FullName.Substring((Get-Location).Path.Length + 1)
            if ($allowed -notcontains $rel) { throw "Unexpected rebuild file: $rel" }
          }
          if ($files.Count -ne 3) { throw "Expected 3 rebuild files, found $($files.Count)." }

      - name: Restore
        run: dotnet restore rebuild\MultiplayerCampaignRebuild.csproj --nologo

      - name: Build
        run: dotnet build rebuild\MultiplayerCampaignRebuild.csproj --no-restore --nologo --verbosity minimal

      - name: Contract checks
        shell: pwsh
        run: |
          $s = Get-Content rebuild\MultiplayerCampaignSubModule.cs -Raw
          foreach ($x in @('LoadHostCampaign','ConnectAsync','WorldComplete','FinishClientLoad','MpcClientParty','HeroCreator.CreateBasicHero','CreateNewClanMobileParty')) {
            if ($s -notmatch [regex]::Escape($x)) { throw "Missing: $x" }
          }
          $xml = Get-Content rebuild\MultiplayerCampaign.xml -Raw
          foreach ($x in @('ExecuteOpenCreate','ExecuteOpenJoin','ExecuteStartHost','ExecuteJoinHost')) {
            if ($xml -notmatch [regex]::Escape($x)) { throw "UI command missing: $x" }
          }

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: MultiplayerCampaign-edit-dll
          path: rebuild\bin\Debug\netstandard2.0\MultiplayerCampaign.dll
          if-no-files-found: error

      - name: Commit verified source
        shell: pwsh
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add rebuild\MultiplayerCampaignSubModule.cs
          if (git diff --cached --quiet) { exit 0 }
          git commit -m 'Fix MCC compile blockers'
          git push origin HEAD:edit

# retrigger clean verification
